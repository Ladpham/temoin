function mapLegend(w) {
  const t = w.line.target;
  if (S.layer === 'reserves') return `<div class="legend"><span><i class="sw" style="--c:var(--crit)"></i>avec réserves bloquantes</span><span><i class="sw" style="--c:var(--warn)"></i>réserves majeures ou mineures</span><span class="muted">Le chiffre indique les réserves ouvertes</span></div>`;
  if (S.layer === 'risk') return `<div class="legend"><span><i class="sw" style="--c:var(--crit);border-radius:50%"></i>taille = exposition si transfert en l’état (réserves non levées + documents à reconstituer)</span></div>`;
  if (S.layer === 'visas') return `<div class="legend"><span><i class="sw" style="--c:var(--info)"></i>visas en attente</span><span><i class="sw" style="--c:var(--crit)"></i>dont en retard</span></div>`;
  const lbl = S.layer === 'docs' ? 'Documentation reçue' : 'Préparation à la remise';
  return `<div class="legend"><span class="muted">${lbl}, objectif à date ${Math.round(t * 100)} % :</span><span><i class="sw" style="--c:var(--ok)"></i>au niveau</span><span><i class="sw" style="--c:var(--warn)"></i>moins de 15 pts d’écart</span><span><i class="sw" style="--c:var(--crit)"></i>en retard</span></div>`;
}

function lineMapSVG(w) {
  const L = w.line, sts = w.stations;
  const pts = sts.map((s) => [s.x, s.y]);
  const decor = L.decor || {};
  let s = `<svg viewBox="0 0 1200 720" role="img" aria-label="Plan schématique de la ${esc(L.name)}">`;
  s += `<defs><pattern id="hatchW" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="var(--hair)" stroke-width="2"/></pattern></defs>`;
  if (decor.paris) {
    const p = decor.paris;
    s += `<ellipse cx="${p.cx}" cy="${p.cy}" rx="${p.rx}" ry="${p.ry}" fill="url(#hatchW)" stroke="var(--hair)" stroke-width="2" stroke-dasharray="6 5"/>`;
    s += `<text x="${p.lx ?? p.cx}" y="${p.ly ?? p.cy}" text-anchor="middle" class="svg-cap" style="font-size:15px;letter-spacing:.35em">Paris</text>`;
  }
  (decor.rivers || []).forEach((r) => {
    s += `<path d="${r.d}" fill="none" stroke="var(--map-water)" stroke-width="${r.w || 14}" stroke-linecap="round" stroke-linejoin="round"/>`;
    if (r.label) s += `<text x="${r.lx}" y="${r.ly}" style="font:italic 500 15px var(--f-body);fill:color-mix(in srgb, var(--info) 70%, var(--muted))">${r.label}</text>`;
  });
  // dépôt (SMR) relié à la ligne
  if (L.depot) {
    const a = sts[L.depot.at];
    const dx = a.x + (L.depot.dx || 0), dy = a.y + (L.depot.dy || 70);
    const right = dx > 760;
    s += `<path d="M${a.x},${a.y} L${dx},${dy}" stroke="var(--line)" stroke-width="5" stroke-dasharray="2 6" stroke-linecap="round" fill="none"/>`;
    s += `<g class="st-node" data-a="depot" role="button" tabindex="0" aria-label="${esc(L.depot.label)}"><rect x="${dx - 22}" y="${dy - 15}" width="44" height="30" rx="5" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5"/><text x="${dx}" y="${dy + 5}" text-anchor="middle" class="svg-txt-m" style="font-weight:700;font-size:13px">SMR</text><text x="${right ? dx + 22 : dx - 22}" y="${dy + 38}" text-anchor="${right ? 'end' : 'start'}" class="st-sub" style="paint-order:stroke;stroke:var(--surface-2);stroke-width:4px">${esc(L.depot.label)}</text></g>`;
  }
  s += `<path d="${smoothPath(pts)}" fill="none" stroke="var(--line)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>`;
  const maxExpo = Math.max(...sts.map((x) => stExposure(w, x.id)), 1);
  sts.forEach((st) => {
    const ready = stReady(w, st.id), docs = stDocs(w, st.id);
    const v = S.layer === 'docs' ? docs : ready;
    const col = tierColor(v, L.target);
    const r = 19, C = 2 * Math.PI * r;
    const sel = S.stationSel === st.id;
    const res = stReserves(w, st.id), bloq = res.filter((x) => x.sev === 'bloquante').length;
    const vis = stVisas(w, st.id);
    let badge = '', under = '';
    if (S.layer === 'reserves' && res.length) badge = `<circle cx="${st.x + 20}" cy="${st.y - 19}" r="14" fill="${bloq ? 'var(--crit)' : 'var(--warn)'}" stroke="var(--surface-2)" stroke-width="2"/><text x="${st.x + 20}" y="${st.y - 14.5}" text-anchor="middle" style="font:700 13px var(--f-body);fill:#fff">${res.length}</text>`;
    if (S.layer === 'visas' && vis.pending) badge = `<circle cx="${st.x + 20}" cy="${st.y - 19}" r="14" fill="${vis.late ? 'var(--crit)' : 'var(--info)'}" stroke="var(--surface-2)" stroke-width="2"/><text x="${st.x + 20}" y="${st.y - 14.5}" text-anchor="middle" style="font:700 13px var(--f-body);fill:#fff">${vis.pending}</text>`;
    if (S.layer === 'risk') { const e = stExposure(w, st.id); const rr = 14 + Math.sqrt(e / maxExpo) * 46; badge = `<circle cx="${st.x}" cy="${st.y}" r="${rr}" fill="color-mix(in srgb, var(--crit) 22%, transparent)" stroke="var(--crit)" stroke-width="1.5"/>`; under = eur(e); }
    else if (S.layer === 'reserves') under = res.length ? `${bloq} bloq.` : '—';
    else if (S.layer === 'visas') under = vis.pending ? `${vis.pending} en att.` : '—';
    else under = `${Math.round(v * 100)} %`;
    const lx = st.x + 9, ly = st.y - 30;
    const rot = -52;
    s += `<g class="st-node ${sel ? 'sel' : ''}" data-a="station" data-id="${st.id}" tabindex="0" role="button" aria-label="${esc(st.name)}">
      ${S.layer === 'risk' ? badge : ''}
      <circle class="halo" cx="${st.x}" cy="${st.y}" r="36" fill="color-mix(in srgb, var(--line) 16%, transparent)"/>
      <circle cx="${st.x}" cy="${st.y}" r="${r}" fill="var(--surface)" stroke="var(--sunken)" stroke-width="6"/>
      ${S.layer === 'risk' ? '' : `<circle cx="${st.x}" cy="${st.y}" r="${r}" fill="none" stroke="${col}" stroke-width="6" stroke-dasharray="${(v * C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${st.x} ${st.y})" stroke-linecap="round"/>`}
      <circle cx="${st.x}" cy="${st.y}" r="9" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/>
      ${st.shared?.length ? `<circle cx="${st.x}" cy="${st.y}" r="4" fill="var(--ink)"/>` : ''}
      ${S.layer === 'risk' ? '' : badge}
      <text x="${lx}" y="${ly}" transform="rotate(${rot} ${lx} ${ly})" class="st-label" style="paint-order:stroke;stroke:var(--surface-2);stroke-width:5px;stroke-linejoin:round">${esc(st.name)}</text>
      <text x="${st.x}" y="${st.y + 44}" text-anchor="middle" class="svg-txt-m" style="font-size:13.5px;font-weight:600;paint-order:stroke;stroke:var(--surface-2);stroke-width:4px">${under}</text>
    </g>`;
  });
  // terminus
  [sts[0], sts[sts.length - 1]].forEach((t, i) => {
    const dir = Math.sign((i ? t.x - sts[sts.length - 2].x : t.x - sts[1].x)) || (i ? 1 : -1);
    s += `<g transform="translate(${t.x + dir * 36} ${t.y})"><circle r="17" fill="var(--line)"/><text y="5.5" text-anchor="middle" style="font:800 15px var(--f-display);fill:${L.textOnColor}">${esc(L.num)}</text></g>`;
  });
  s += `</svg>`;
  return s;
}

  return `

    </div>

      <div class="kv"><span>Documentation reçue</span><b>${Math.round(stDocs(w, st.id) * 100)} %</b></div>
      <div class="kv"><span>Objets suivis</span><b>${objs.length}</b></div>
      <div class="kv"><span>Exposition si transfert en l’état</span><b>${eur(stExposure(w, st.id))}</b></div>
    </div>
    <div class="sec"><h3>Objets par état</h3>
      <div class="stack">${byState.map((n, i) => n ? `<i style="width:${(n / objs.length) * 100}%;background:${STATES[i].c}" title="${STATES[i].l} : ${n}"></i>` : '').join('')}</div>
      <div class="stat-inline">${byState.map((n, i) => `<span><i class="sw" style="--c:${STATES[i].c}"></i> ${STATES[i].s} <b>${n}</b></span>`).join('')}</div>

    ${greys.length ? `<div class="note-ai"><div class="h">${ic('alert')} Zone grise</div>${greys.map((g) => `<b>${esc(g.label)}</b> : ${esc(g.note)}`).join('<br>')}</div>` : ''}
    <div class="sec"><h3>Réserves bloquantes (${bloq.length})</h3>
      ${bloq.slice(0, 4).map((r) => `<button class="kv" style="width:100%;background:none;border-left:0;border-right:0;border-top:0;padding-inline:0;text-align:left" data-a="obj" data-id="${r.obj}"><span>${esc(r.label)}<br><span class="small muted">${esc(objById(w, r.obj).name)}</span></span><span class="pill crit">${esc(fmtD(r.due))}</span></button>`).join('') || '<p class="small muted">Aucune réserve bloquante.</p>'}
    </div>
    ${vis.length ? `<div class="sec"><h3>Visas liés</h3>${vis.map((v) => visaLine(v)).join('')}</div>` : ''}
    <button class="btn" data-a="ask" data-q="Qu’est-ce qui bloque la remise de ${esc(st.name)} ?">${ic('spark')} Qu’est-ce qui bloque cette gare ?</button>`;
}

function visaLine(v) {

}

function zoneInfo(w, st, fam) {
  const objs = w.objects.filter((o) => o.st === st.id && o.fam === fam);
  const grey = w.greyZones.find((g) => g.st === st.id && g.fam === fam && !g.done);
  const gest = objs[0]?.gest || famById(fam).gest;
  const minState = objs.length ? Math.min(...objs.map((o) => o.state)) : 0;
  const lot = objs[0] ? w.lots.find((l) => l.id === objs[0].lot) : null;
  return { objs, grey, gest, minState, lot };
}

function zoneFill(w, info) {
  if (S.colorBy === 'gest') {
    if (info.grey) return { fill: 'url(#hatchQ)', stroke: 'var(--crit)', dash: '5 4' };
    const c = gestById(info.gest).c; return { fill: `color-mix(in srgb, ${c} 24%, var(--surface))`, stroke: c };
  }
  if (S.colorBy === 'etat') { const c = STATES[info.minState].c; return { fill: `color-mix(in srgb, ${c} 24%, var(--surface))`, stroke: c }; }
  const i = info.lot ? w.lots.indexOf(info.lot) : -1;
  const c = i < 0 ? 'var(--muted)' : LOT_COLORS[i % LOT_COLORS.length];
  return { fill: `color-mix(in srgb, ${c} 22%, var(--surface))`, stroke: c };
}

    <path d="M700 280 L820 382 M716 280 L836 382"/><path d="M880 382 L990 472 M896 382 L1006 472"/>

    ${Array.from({ length: 6 }, (_, i) => `<path d="M${888 + i * 18} ${389 + i * 14.5} l10 0"/>`).join('')}
    <rect x="1046" y="150" width="28" height="322" rx="3" stroke-dasharray="3 3"/>
    <path d="M330 472 H1070" stroke-width="3" stroke-dasharray="26 6"/>
  </g>
  <g pointer-events="none">
    <g clip-path="url(#tunnelClip)"><g class="train-move">
      <rect x="0" y="498" width="300" height="40" rx="12" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>

    <circle cx="300" cy="128" r="14" fill="color-mix(in srgb, var(--g-ville) 40%, var(--surface))"/><path d="M300 142 v28" stroke="var(--ink-2)" stroke-width="2"/>

function sectionLegend(w) {
  if (S.colorBy === 'gest') return `<div class="legend">${GEST.map((g) => `<span><i class="sw" style="--c:${g.c}"></i>${esc(g.short)}</span>`).join('')}<span><i class="sw" style="background:repeating-linear-gradient(45deg,var(--crit) 0 2px,transparent 2px 4px)"></i>à arbitrer</span><span class="muted">· point rouge : réserve bloquante</span></div>`;

      <div class="kv"><span>Convention</span><b>${conv ? `<span class="pill ${conv.status === 'signée' ? 'ok' : conv.status === 'en négociation' ? 'warn' : 'crit'}">${esc(conv.status)}</span>` : '—'}</b></div>

      ${info.objs.length > 8 ? `<button class="btn sm" data-a="objList" data-st="${st.id}" data-fam="${fam}">Voir les ${info.objs.length} objets</button>` : ''}
    </div>`;
}

/* ---------------- Lots & marchés ---------------- */

  const tot = rows.reduce((a, { l, s }) => ({ budget: a.budget + l.budget, eac: a.eac + l.eac, eng: a.eng + l.engagements.length, engOk: a.engOk + l.engagements.filter((e) => e.ok === 'ok').length, debt: a.debt + s.expo }), { budget: 0, eac: 0, eng: 0, engOk: 0, debt: 0 });
  return `
  ${pageHead({ title: 'Lots & marchés', lede: 'Le grand livre de chaque marché : périmètre, valeur rendue, engagements techniques, documentation et réserves. Un clic ouvre le détail par tâche, objet et responsable.', actions: `<button class="btn" data-a="ask" data-q="Quel lot me coûte le plus si on transfère en l’état ?">${ic('spark')} Quel lot pèse le plus ?</button>` })}
  <div class="kpis k5">
    <div class="kpi"><div class="lbl">Montant initial des marchés</div><div class="val">${eurParts(tot.budget)}</div><div class="sub">${w.lots.length} lots suivis</div></div>
    <div class="kpi"><div class="lbl">Coût final estimé</div><div class="val">${eurParts(tot.eac)}</div><div class="sub"><span class="${tot.eac > tot.budget ? 'crit' : 'ok'}">${tot.eac > tot.budget ? '+' : ''}${((tot.eac / tot.budget - 1) * 100).toFixed(1).replace('.', ',')} %</span> avenants compris</div></div>

    <div class="kpi"><div class="lbl">Dette technique estimée</div><div class="val">${eurParts(tot.debt)}</div><div class="sub">reste à charge si transfert en l’état</div></div>

  <div class="tbl-wrap"><table class="tbl wide">

    <tbody>${rows.map(({ l, s }) => `<tr data-a="lot" data-id="${l.id}">
      <td><div class="t-main"><span class="mono">${esc(l.code)}</span></div><div class="t-sub">${esc(l.title)}</div></td>
      <td><div>${esc(l.entShort)}</div><div class="t-sub">${esc(l.group || '')}</div></td>
      <td class="t-sub" style="max-width:200px">${esc(l.scope)}</td>
      <td class="r nowrap">${eur(l.budget)} → <b class="${l.eac > l.budget * 1.05 ? 'crit' : ''}">${eur(l.eac)}</b></td>
      <td style="min-width:120px"><div class="bar"><i style="width:${l.prog}%;--c:var(--ink-2)"></i></div><div class="t-sub">${l.prog} % · fin ${esc(fmtD(l.endF, { y: true }))}</div></td>
      <td class="r">${l.engagements.filter((e) => e.ok === 'ok').length}/${l.engagements.length}</td>
      <td style="min-width:120px"><div class="bar"><i style="width:${Math.round(s.docs * 100)}%;--c:${tierColor(s.docs, w.line.target)}"></i></div><div class="t-sub">${Math.round(s.docs * 100)} % · ${nf.format(s.docsMissing)} manquants</div></td>
      <td class="r nowrap">${s.res} ${s.bloq ? `<span class="pill crit">${s.bloq} bloq.</span>` : ''}</td>

function lotDrawer(w, l) {
  const s = lotStats(w, l);
  const objs = w.objects.filter((o) => o.lot === l.id);
  const byState = STATES.map((_, i) => objs.filter((o) => o.state === i).length);
  const res = w.reserves.filter((r) => r.status !== 'levée' && objs.some((o) => o.id === r.obj)).sort((a, b) => sevRank(a.sev) - sevRank(b.sev)).slice(0, 6);
  const cpi = l.evm.ev[l.evm.now] / l.evm.ac[l.evm.now], spi = l.evm.ev[l.evm.now] / l.evm.pv[l.evm.now];
  return `<div class="drawer wide" role="dialog" aria-label="Lot ${esc(l.code)}">
    <div class="drawer-head"><div class="row"><span class="pill outline mono">${esc(l.code)}</span><span class="pill ${l.type === 'GC' ? 'info' : 'line'}">${esc(LOT_TYPES[l.type])}</span><button class="x" data-a="close" aria-label="Fermer">${ic('x')}</button></div>
      <h2>${esc(l.title)}</h2><p class="small muted">${esc(l.ent)}${l.group ? ` · ${esc(l.group)}` : ''} · ${esc(l.scope)}</p></div>
    <div class="drawer-body">
      <div class="kpis k4">
        <div class="kpi"><div class="lbl">Initial</div><div class="val" style="font-size:22px">${eurParts(l.budget)}</div><div class="sub">avenants ${eur(l.avenants)}</div></div>
        <div class="kpi"><div class="lbl">Coût final estimé</div><div class="val" style="font-size:22px">${eurParts(l.eac)}</div><div class="sub">${l.eac > l.budget ? '+' : ''}${((l.eac / l.budget - 1) * 100).toFixed(1).replace('.', ',')} %</div></div>
        <div class="kpi"><div class="lbl">Indice de coût (CPI)</div><div class="val" style="font-size:22px" class="${cpi < .95 ? 'crit' : ''}">${cpi.toFixed(2).replace('.', ',')}</div><div class="sub">valeur acquise / coût réel</div></div>
        <div class="kpi"><div class="lbl">Indice de délai (SPI)</div><div class="val" style="font-size:22px">${spi.toFixed(2).replace('.', ',')}</div><div class="sub">valeur acquise / prévue</div></div>
      </div>
      <div class="sec"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h3>Valeur rendue</h3><div class="evm-legend" style="margin-left:auto"><span><i style="--c:var(--muted)"></i>prévue</span><span><i style="--c:var(--line)"></i>acquise</span><span><i style="--c:var(--ink)"></i>coût réel</span></div></div>${evmChart(l)}</div>
      <div class="sec"><h3>Décomposition des tâches</h3><div class="tree">${lotWbs(w, l, s).map((t) => `<div class="tree-row ${t.child ? 'child' : ''}"><span>${esc(t.l)}</span><div class="bar"><i style="width:${t.p}%;--c:${t.p >= 100 ? 'var(--ok)' : 'var(--ink-2)'}"></i></div><span class="v">${t.p} %</span></div>`).join('')}</div></div>
      <div class="sec"><h3>Engagements techniques</h3>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Engagement</th><th>Cible</th><th>Mesuré</th><th>État</th><th>Source</th></tr></thead><tbody>
        ${l.engagements.map((e) => `<tr style="cursor:default"><td>${esc(e.l)}</td><td class="nowrap">${esc(e.target)}</td><td class="nowrap"><b>${esc(e.meas)}</b></td><td>${e.ok === 'ok' ? '<span class="pill ok">conforme</span>' : e.ok === 'ecart' ? '<span class="pill crit">écart</span>' : '<span class="pill warn">à vérifier</span>'}</td><td class="t-sub">${esc(e.src)}</td></tr>`).join('')}
        </tbody></table></div></div>
      <div class="g-2 grid">
        <div class="sec"><h3>Objets du lot (${objs.length})</h3><div class="stack">${byState.map((n, i) => n ? `<i style="width:${(n / Math.max(1, objs.length)) * 100}%;background:${STATES[i].c}"></i>` : '').join('')}</div>
          <div class="stat-inline">${byState.map((n, i) => `<span>${STATES[i].s} <b>${n}</b></span>`).join('')}</div>
          <button class="btn sm" data-a="objList" data-lot="${l.id}">Ouvrir dans le registre</button></div>
        <div class="sec"><h3>Chaîne de responsabilité</h3>
          ${[[l.sgp, 'Maîtrise d’ouvrage'], [l.entLead, 'Entreprise'], [l.recv, 'Réception IDFM'], [l.gi, 'Futur gestionnaire']].map(([p, r]) => `<div class="kv"><span style="display:flex;gap:8px;align-items:center">${av(p, 'sm')}<span>${esc(PEOPLE[p].name)}<br><span class="small muted">${esc(PEOPLE[p].role)}</span></span></span><b class="small muted">${r}</b></div>`).join('')}</div>
      </div>
      <div class="sec"><h3>Réserves prioritaires</h3>${res.map((r) => resRow(w, r)).join('') || '<p class="small muted">Aucune réserve ouverte.</p>'}</div>

    </div></div>`;
}

function lotWbs(w, l, s) {
  const p = l.prog, c = (x) => Math.max(0, Math.min(100, Math.round(x)));
  const all = s.objs.flatMap((o) => o.res);
  const lifted = all.length ? all.filter((r) => r.status === 'levée').length / all.length : 1;
  const base = l.type === 'GC'
    ? [['Études d’exécution', 100], ['Génie civil des gares', c(p + 2)], ['Tunnel et rameaux', c(p + 3)], ['Ouvrages annexes', c(p - 1)], ['Second œuvre de génie civil', c(p - 7)]]
    : [['Études d’exécution', c(p + 30)], ['Fabrication et approvisionnement', c(p + 10)], ['Installation', c(p)], ['Essais', c(p - 16)]];
  return [...base.map(([lb, v]) => ({ l: lb, p: v })), { l: 'Documentation et DOE', p: c(s.docs * 100) }, { l: 'Levée des réserves', p: c(lifted * 100) }];
}

function evmChart(l) {
  const { pv, ev, ac, now, months } = l.evm;
  const W_ = 680, H = 210, pl = 54, pr = 14, pt = 12, pb = 28;
  const max = Math.max(...pv, ...ac.slice(0, now + 1)) * 1.08;
  const x = (i) => pl + (i / (pv.length - 1)) * (W_ - pl - pr);
  const y = (v) => pt + (1 - v / max) * (H - pt - pb);
  const path = (arr, n = arr.length) => arr.slice(0, n).map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const ticks = [0, .25, .5, .75, 1].map((t) => t * max);
  let s = `<svg viewBox="0 0 ${W_} ${H}" style="width:100%;height:auto">`;
  ticks.forEach((t) => { s += `<line x1="${pl}" x2="${W_ - pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--hair-2)"/><text x="${pl - 8}" y="${y(t) + 4}" text-anchor="end" class="svg-txt-m" style="font-size:9.5px">${eur(t)}</text>`; });
  const step = Math.max(6, Math.ceil(months.length / 36) * 6);
  months.forEach((m, i) => { if (i % step === 0) s += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" class="svg-txt-m" style="font-size:9.5px">${m}</text>`; });
  s += `<path d="${path(ev, now + 1)} L${x(now)},${y(0)} L${x(0)},${y(0)} Z" fill="color-mix(in srgb, var(--line) 12%, transparent)"/>`;
  s += `<path d="${path(pv)}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/>`;
  s += `<path d="${path(ac, now + 1)}" fill="none" stroke="var(--ink)" stroke-width="2"/>`;
  s += `<path d="${path(ev, now + 1)}" fill="none" stroke="var(--line)" stroke-width="2.5"/>`;
  s += `<line x1="${x(now)}" x2="${x(now)}" y1="${pt}" y2="${H - pb}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${x(now) - 4}" y="${pt + 10}" text-anchor="end" style="font:600 10px var(--f-body);fill:var(--line-ink)">aujourd’hui</text>`;
  s += `<circle cx="${x(now)}" cy="${y(ev[now])}" r="4.5" fill="var(--line)" stroke="var(--surface)" stroke-width="2"/><circle cx="${x(now)}" cy="${y(ac[now])}" r="4" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>`;
  return s + `</svg>`;
}

function visaCard(w, v) {
  const done = v.steps.filter((x) => x.s === 'vise' || x.s === 'rem').length;
  const late = visaLate(v);
  return `<div class="visa-card" data-a="visa" data-id="${v.id}" tabindex="0" role="button">
    <div class="top-row"><span class="pill outline">${esc(v.kind)}</span><span class="mono muted">${esc(v.ver)}</span>${late ? '<span class="pill crit">en retard</span>' : visaDone(v) ? '<span class="pill ok">terminé</span>' : ''}<span class="small muted" style="margin-left:auto">échéance ${esc(fmtD(v.due))}</span></div>
    <div class="t">${esc(v.title)}</div>
    <div class="small muted">Émis par ${esc(PEOPLE[v.from].name)} (${esc(orgOf(v.from).short)}) · ${v.objs ? `${v.objs} objets · ${eur(v.value)} d’actifs` : esc(v.scopeTxt || '')}</div>

const STEP = {
  att: { c: 'var(--muted)', i: 'clock', l: 'en attente' }, lu: { c: 'var(--info)', i: 'eye', l: 'lu' },
  vise: { c: 'var(--ok)', i: 'check', l: 'visé' }, rem: { c: 'var(--warn)', i: 'pen', l: 'visé avec remarques' }, ref: { c: 'var(--crit)', i: 'x', l: 'refusé' },
};
function stepAv(s) {
  const st = STEP[s.s];
  return `<span class="av-wrap" title="${esc(PEOPLE[s.p].name)} · ${st.l}">${av(s.p, 'sm', true)}<span class="st" style="background:${st.c}">${ic(st.i)}</span></span>`;

function receiptMatrix(w) {

function networkSVG(w, load) {
  const CL = [
    { org: 'IDFM', x: 500, y: 300 }, { org: 'SGP', x: 210, y: 150 }, { org: 'GT', x: 830, y: 130 },
    { org: 'EXP', x: 905, y: 360 }, { org: 'COLL', x: 730, y: 498 }, { org: 'ENT', x: 300, y: 492 }, { org: 'ETAT', x: 115, y: 400 },
  ];
  const me = persona().person;
  const pos = {};
  CL.forEach((c) => {
    const ppl = Object.keys(PEOPLE).filter((p) => clusterOf(p) === c.org && PEOPLE[p].net !== false && p !== me);
    const n = ppl.length;
    ppl.forEach((p, k) => {
      const rad = c.org === 'IDFM' ? 135 : n <= 2 ? 50 : 54 + n * 9;
      const a = (k / Math.max(1, n)) * Math.PI * 2 + (c.org === 'IDFM' ? .35 : -.5);
      pos[p] = { x: c.x + (n === 1 ? 0 : Math.cos(a) * rad), y: c.y + (n === 1 ? 0 : Math.sin(a) * rad * (c.org === 'IDFM' ? .66 : .78)) };
    });
  });
  pos[me] = { x: 500, y: 300 };
  let s = `<svg viewBox="0 0 1000 620" role="img" aria-label="Réseau des parties prenantes de la ${esc(w.line.name)}">`;
  CL.forEach((c) => {
    if (c.org === 'IDFM') return;
    const n = Object.keys(PEOPLE).filter((p) => clusterOf(p) === c.org && PEOPLE[p].net !== false && p !== me).length;
    const top = n > 1 ? (n <= 2 ? 50 : 54 + n * 9) * .78 : 0;
    s += `<text x="${c.x}" y="${c.y - top - 48}" text-anchor="middle" class="svg-cap" style="font-size:12.5px">${esc(c.org === 'EXP' ? `Exploitant · ${w.line.opShort}` : CLUSTERS[c.org])}</text>`;
  });
  Object.entries(load).forEach(([p, v]) => {
    if (!pos[p] || p === me || !v.pending) return;
    const a = pos[me], b = pos[p];
    s += `<path d="M${a.x},${a.y} Q${(a.x + b.x) / 2},${(a.y + b.y) / 2 - 40} ${b.x},${b.y}" fill="none" stroke="${v.late ? 'var(--crit)' : 'var(--hair)'}" stroke-width="${1.5 + Math.min(7, v.pending * 1.6)}" stroke-linecap="round" opacity="${v.late ? .5 : 1}"/>`;
  });
  Object.entries(pos).forEach(([p, q]) => {
    const v = load[p] || { pending: 0, late: 0 };
    const r = p === me ? 34 : 19 + Math.min(10, v.pending * 2.5);
    const c = orgOf(p).c;
    s += `<g class="node" data-a="ask" data-q="Qu’est-ce que ${esc(PEOPLE[p].name)} doit encore faire ?" role="button" tabindex="0" aria-label="${esc(PEOPLE[p].name)}"><circle cx="${q.x}" cy="${q.y}" r="${r}" fill="color-mix(in srgb, ${c} 18%, var(--surface))" stroke="${v.late ? 'var(--crit)' : c}" stroke-width="${p === me ? 3.5 : 2.5}"/>
      <text x="${q.x}" y="${q.y + 5}" text-anchor="middle" style="font:700 ${p === me ? 16 : 13}px var(--f-body);fill:${c}">${esc(PEOPLE[p].ini)}</text>
      <text x="${q.x}" y="${q.y + r + 18}" text-anchor="middle" style="font:500 14px var(--f-body);fill:var(--ink-2);paint-order:stroke;stroke:var(--surface);stroke-width:4px">${esc(PEOPLE[p].first)}${v.pending ? ` · ${v.pending}` : ''}</text></g>`;
  });
  return s + `</svg><p class="small muted" style="padding:0 18px 14px">Épaisseur du lien : visas en attente entre vous et la personne. En rouge : en retard. Cliquez sur une personne pour demander au copilote ce qu’elle doit encore faire.</p>`;
}

function priorities(w, P) {
  const me = P.person, items = [];
  w.visas.filter((v) => !visaDone(v)).forEach((v) => {
    const s = v.steps.find((x) => x.p === me && (x.s === 'att' || x.s === 'lu')); if (!s) return;
    const late = v.due < TODAY; const ok = v.steps.filter((x) => x.s === 'vise' || x.s === 'rem').length;
    items.push({ score: 72 + (late ? 24 : 0) - Math.max(0, days(v.due)), t: `Viser « ${esc(v.title)} »`, why: `${late ? `<span class="crit">${-days(v.due)} j de retard</span>` : `Échéance ${rel(v.due)}`} · ${ok}/${v.steps.length} visas obtenus${v.value ? ` · ${eur(v.value)} d’actifs concernés` : ''}`, tags: [[late ? 'crit' : 'info', esc(v.kind)]], acts: [{ label: 'Ouvrir', attrs: `data-a="visa" data-id="${v.id}"` }] });
  });
  w.mails.filter((m) => !m.done && m.to.includes(me) && ['Action', 'Réserve', 'Contrat', 'Document'].includes(m.tag)).forEach((m) => items.push({ score: m.tag === 'Action' ? 84 : m.tag === 'Document' ? 58 : 68, t: `Traiter : ${esc(m.subj)}`, why: `${esc(PEOPLE[m.from].name)} (${esc(orgOf(m.from).short)}) · ${m.extract.length} mises à jour proposées par Témoin`, tags: [[TAGC[m.tag], esc(m.tag)]], acts: [{ label: 'Lire', attrs: `data-a="mail" data-id="${m.id}"` }] }));
  w.greyZones.filter((g) => !g.done && (!P.gest || g.cands.includes(P.gest))).slice(0, 2).forEach((g) => items.push({ score: 66 + Math.min(18, -days(g.since) / 3), t: `Faire trancher : ${esc(g.label)}`, why: esc(g.note), tags: [['crit', 'zone grise'], ['outline', `ouverte ${rel(g.since)}`]], acts: [{ label: 'Note d’arbitrage', attrs: `data-a="ask" data-q="Prépare la note d’arbitrage : ${esc(g.label)}"` }] }));
  if (!P.gest) {
    const load = peopleLoad(w);
    const top = Object.entries(load).filter(([p, v]) => p !== me && v.late).sort((a, b) => b[1].late - a[1].late)[0];
    if (top) items.push({ score: 70 + top[1].late * 3, t: `Relancer ${esc(PEOPLE[top[0]].name)} (${esc(orgOf(top[0]).short)})`, why: `${top[1].late} visa${top[1].late > 1 ? 's' : ''} en retard sur ${top[1].pending} en attente · le message est prêt`, tags: [['warn', 'relance']], acts: [{ label: 'Voir la relance', attrs: 'data-a="ask" data-q="Prépare la relance pour les visas en retard"' }] });
  }
  const objs = scopeObjs(w, P);
  const bySt = {}; objs.forEach((o) => { if (!o.st) return; const b = objReserves(w, o.id).filter((r) => r.sev === 'bloquante').length; if (b) bySt[o.st] = (bySt[o.st] || 0) + b; });
  const topSt = Object.entries(bySt).sort((a, b) => b[1] - a[1])[0];
  if (topSt) { const st = stById(w, topSt[0]); const n = topSt[1]; items.push({ score: 60 + n * 2, t: `${P.id === 'sgp' ? 'Faire lever' : 'Suivre'} ${n} réserve${n > 1 ? 's' : ''} bloquante${n > 1 ? 's' : ''} à ${esc(st.name)}`, why: `Préparation ${pc(stReady(w, st.id))} % pour un objectif de ${pc(st.target)} % · exposition ${eur(stExposure(w, st.id))}`, tags: [['crit', 'réserves']], acts: [{ label: 'Voir la gare', attrs: `data-a="enterStation" data-id="${st.id}"` }] }); }
  const lots = w.lots.map((l) => ({ l, m: objs.filter((o) => o.lot === l.id).reduce((a, o) => a + o.docs.filter((x) => x.s !== 'ok').length, 0) })).sort((a, b) => b.m - a.m)[0];
  if (lots && lots.m) items.push({ score: 56, t: `${P.id === 'sgp' ? 'Obtenir' : 'Faire compléter'} les ${nf.format(lots.m)} documents manquants du lot ${esc(lots.l.code)}`, why: `${esc(lots.l.entShort)} · ${esc(lots.l.title)}`, tags: [['info', 'documentation']], acts: [{ label: 'Ouvrir le lot', attrs: `data-a="lot" data-id="${lots.l.id}"` }] });

/* ---------- Lecture d'un objet ---------- */
function objBlockers(w, o) {
  if (o.state === 4) return `Objet <b>remis en gestion</b> à ${esc(gestById(o.gest).label)}. ${o.gpa && o.gpa > TODAY ? `La garantie de parfait achèvement court jusqu’au ${esc(fmtD(o.gpa, { y: true }))} : toute réserve relevée d’ici là reste à la charge de l’entreprise.` : 'La garantie de parfait achèvement est échue.'}`;
  const parts = [];
  const miss = o.docs.filter((d) => d.s !== 'ok');
  const res = objReserves(w, o.id); const bl = res.filter((r) => r.sev === 'bloquante');
  if (o.state === 0) parts.push('la <b>réception</b> par la SGP n’est pas encore prononcée');
  if (miss.length) parts.push(`<b>${miss.length} document${miss.length > 1 ? 's' : ''}</b> à obtenir (${miss.slice(0, 3).map((d) => esc(d.t.toLowerCase())).join(', ')}${miss.length > 3 ? '…' : ''})`);
  if (bl.length) parts.push(`<b>${bl.length} réserve${bl.length > 1 ? 's' : ''} bloquante${bl.length > 1 ? 's' : ''}</b> à lever (${esc(bl[0].label.toLowerCase())}, attendue le ${esc(fmtD(bl[0].due))})`);
  else if (res.length) parts.push(`${res.length} réserve${res.length > 1 ? 's' : ''} non bloquante${res.length > 1 ? 's' : ''} à lever`);
  if (isGrey(w, o)) parts.push('un <b>futur gestionnaire à désigner</b>');
  if (o.state <= 2) parts.push(`le visa d’IDFM et de ${esc(gestById(o.gest).short)}`);
  let s = parts.length ? `Pour être remis en gestion, il reste : ${parts.join(' ; ')}.` : 'Tout est prêt : il ne manque que la signature du PV de remise.';
  const e = objExposure(w, o);
  if (e) s += ` Si l’objet était remis aujourd’hui, environ <b>${eur(e)}</b> resteraient à la charge du futur gestionnaire.`;
  if (o.gpa && o.gpa < TODAY && res.length) s += ' <b>Attention :</b> la garantie de parfait achèvement est échue, les réserves restantes sont plus difficiles à faire reprendre.';
  return s;
}

function relanceText(w, v, late) {
  const names = late.map((s) => PEOPLE[s.p].first).join(', ');
  return `Objet : ${v.title} (${v.ver}), visa attendu depuis le ${fmtD(v.due)}\n\nBonjour ${names},\n\nLe circuit de visa « ${v.title} » attend votre avis depuis le ${fmtD(v.due)}. ${v.steps.filter((s) => s.s === 'vise' || s.s === 'rem').length} visas sur ${v.steps.length} sont déjà donnés.\n\n${v.objs ? `Ce dossier conditionne la remise de ${v.objs} objets (${eur(v.value)} d’actifs). ` : ''}Pouvez-vous me transmettre votre visa, ou vos remarques, d’ici ${fmtD(dd(3))} ?\n\nMerci,\n${meName()}`;
}

/* ---------- Effets des courriels appliqués au jumeau ---------- */
const pctTxt = (x) => `${pc(x)} %`;
const FX = {
  doe(w, m) {
    const A = stById(w, m.a), B = stById(w, m.b); const b0 = stDocs(w, A.id), b1 = stDocs(w, B.id);
    w.objects.filter((o) => (o.st === A.id || o.st === B.id) && famById(o.fam).domain !== 'GC').forEach((o) => o.docs.forEach((d) => { if (d.s !== 'ok' && !(o.fam === 'ASC' && /Notice/.test(d.t)) && !(o.fam === 'FQ' && /PV/.test(d.t))) { d.s = 'ok'; d.at = TODAY; } }));
    w.objects.filter((o) => (o.st === A.id || o.st === B.id) && o.state === 1 && o.docs.every((d) => d.s === 'ok')).forEach((o) => { o.state = 2; o.hist.unshift({ t: 'Dossier des ouvrages exécutés complet (tranche 3)', at: TODAY, p: 'lgirard', c: 'var(--info)' }); });
    return [`Documentation ${esc(A.name)} : <s>${pctTxt(b0)}</s> → <ins>${pctTxt(stDocs(w, A.id))}</ins> · ${esc(B.name)} : <s>${pctTxt(b1)}</s> → <ins>${pctTxt(stDocs(w, B.id))}</ins>`, null, null];
  },
  notices(w, m) {
    const st = stById(w, m.st); const before = stReserves(w, st.id).length;
    const ems = w.objects.filter((o) => o.st === st.id && o.fam === 'EM').slice(0, 4);
    ['Plans de graissage absents', 'Couples de serrage non indiqués', 'Procédure de remise en service incomplète', 'Pièces d’usure sans référence fournisseur'].forEach((label, i) => {
      const o = ems[i % ems.length]; if (!o) return;
      const r = { id: `R-${1000 + w.reserves.length}`, obj: o.id, sev: i < 2 ? 'majeure' : 'mineure', label, cost: [14e3, 9e3, 6e3, 4e3][i], due: dd(30), status: 'ouverte', raised: TODAY };
      o.res.push(r); w.reserves.push(r);
      o.docs.forEach((d) => { if (/Notice|graissage/.test(d.t)) d.s = 'rev'; });
      o.hist.unshift({ t: `Réserve documentaire créée : ${label}`, at: TODAY, p: 'fdiallo', c: 'var(--warn)' });
    });
    return [`Réserves ouvertes à ${esc(st.name)} : <s>${before}</s> → <ins>${stReserves(w, st.id).length}</ins>`, null, null];
  },
  parvis(w, m) {
    const before = w.greyZones.filter((g) => !g.done).length;
    if (!w.greyZones.some((g) => g.id === 'g2')) w.greyZones.push({ id: 'g2', st: m.st, fam: 'ECL', label: `Éclairage des abords de ${stById(w, m.st).name}`, cands: ['VILLE', 'SGP'], since: TODAY, note: 'Les candélabres posés par la SGP ne sont pas au standard de la commune : reprise conditionnée à leur remplacement ou à une compensation.' });
    return [`Zones grises ouvertes : <s>${before}</s> → <ins>${w.greyZones.filter((g) => !g.done).length}</ins>`, null, null];
  },
  pmr(w, m) {
    const st = stById(w, m.st); const b0 = stReserves(w, st.id).filter((r) => r.sev === 'bloquante').length; const r0 = stReady(w, st.id);
    const ascs = w.objects.filter((o) => o.st === st.id && o.fam === 'ASC');
    ['Ascenseur à l’arrêt lors de la visite du 27 octobre', 'Téléalarme non raccordée au PCC', 'Ascenseur à l’arrêt lors de la visite du 27 octobre'].forEach((label, i) => {
      const o = ascs[i % ascs.length]; if (!o) return;
      const r = { id: `R-${1000 + w.reserves.length}`, obj: o.id, sev: 'bloquante', label, cost: 42e3, due: dd(14), status: 'ouverte', raised: TODAY };
      o.res.push(r); w.reserves.push(r);
      o.hist.unshift({ t: `Réserve bloquante créée : ${label}`, at: TODAY, p: 'epetit', c: 'var(--crit)' });
    });
    return [`Réserves bloquantes à ${esc(st.name)} : <s>${b0}</s> → <ins>${stReserves(w, st.id).filter((r) => r.sev === 'bloquante').length}</ins>`, `Préparation de ${esc(st.name)} : <s>${pctTxt(r0)}</s> → <ins>${pctTxt(stReady(w, st.id))}</ins>`, null];
  },
  levee(w) {
    const lot = w.lots.filter((l) => l.type === 'GC').map((l) => ({ l, r: w.objects.filter((o) => o.lot === l.id).flatMap((o) => objReserves(w, o.id)) })).sort((a, b) => b.r.length - a.r.length)[0];
    if (!lot) return [null, null];
    const before = lot.r.length;
    lot.r.slice(0, 5).forEach((r) => { r.status = 'levée'; const o = objById(w, r.obj); o.hist.unshift({ t: `Réserve levée : ${r.label}`, at: TODAY, p: 'njoly', c: 'var(--ok)' }); });
    lot.r.slice(5).forEach((r, i) => { r.due = dd(20 + i * 4); r.status = 'en levée'; });
    return [`Réserves ouvertes du lot ${esc(lot.l.code)} : <s>${before}</s> → <ins>${before - Math.min(5, before)}</ins>`, `${Math.max(0, before - 5)} dates de levée planifiées`];
  },
  mr(w) {
    const rames = w.objects.filter((o) => o.fam === 'MR').slice(-4);
    const b = w.objects.filter((o) => o.fam === 'MR' && o.state >= 1).length;
    rames.forEach((o) => { if (o.state < 1) { o.state = 1; o.rec = TODAY; o.gpa = dd(365); o.dec = dd(3652); } o.docs.forEach((d) => { if (/Dossier de rame|PV/.test(d.t)) { d.s = 'ok'; d.at = TODAY; } }); o.hist.unshift({ t: 'Livraison et essais statiques validés', at: TODAY, p: 'vsimon', c: 'var(--warn)' }); });
    return [`Rames réceptionnées : <s>${b}</s> → <ins>${w.objects.filter((o) => o.fam === 'MR' && o.state >= 1).length}</ins>`, null];
  },
  conv() { return [null, null]; },
  rex() { return [null, null]; },
};
function previewMail(w, m) {
  if (!m.fx || !FX[m.fx]) return null;
  try { const c = structuredClone(w); return FX[m.fx](c, m); } catch (e) { return null; }
}

function sendChat(q) {

  setTimeout(() => { const i = S.chat.indexOf(t); const a = answer(q); if (i >= 0) S.chat.splice(i, 1, a); renderChat(); }, 520 + Math.random() * 380);
}

function findStation(w, t) {
  const cands = [...w.stations].sort((a, b) => b.name.length - a.name.length);
  return cands.find((s) => t.includes(norm(s.name))) || cands.find((s) => norm(s.name).split(/[–\- ]/).filter((x) => x.length > 5).some((x) => t.includes(x)));
}
function findPerson(t) { return Object.values(PEOPLE).find((p) => p.last && t.includes(norm(p.name))) || Object.values(PEOPLE).find((p) => p.last && t.includes(norm(p.last))); }

function answer(q) {
  const w = W(), t = norm(q);
  const st = findStation(w, t);
  const o = w.objects.find((x) => t.includes(norm(x.id)));
  if (o) return /relance|redige/.test(t) ? ansObjRelance(w, o) : ansObj(w, o);
  if (/note d.?arbitrage|arbitrage/.test(t)) return ansArbitrage(w, t);
  if (/relan|retard/.test(t)) { const lot = w.lots.find((l) => t.includes(norm(` ${l.code} `)) || t.includes(norm(`lot ${l.code}`))); return lot ? ansLotRelance(w, lot) : ansRelance(w); }
  if (/doit encore|doit faire/.test(t)) { const p = findPerson(t); if (p) return ansPerson(w, p); }
  if (/comite|copil|ordre du jour|prepare.?moi/.test(t)) return ansComite(w);
  if (/retour|rex|experience/.test(t)) return ansRex(w);
  if (/trottoir|parvis|eclairage|qui gere|responsable des|domanial|qui entretient/.test(t)) return ansGestion(w, st || w.stations[w.line.focus.parvis]);
  if (/bloqu|reste|manque.*gare|pret/.test(t) && st) return ansStation(w, st);
  if (/escalier|document|doe|notice|manqu/.test(t)) return ansDocs(w, t);
  if (/cout|combien|exposition|dette|pese|argent|€|transfert en l/.test(t)) return ansMoney(w);
  if (/reunion|compte rendu|hier/.test(t)) return ansMeeting(w);
  if (/ligne|compar|portefeuille|autres/.test(t)) return ansPortfolio(w);
  if (st) return ansStation(w, st);
  if (/^(bonjour|salut|hello|coucou)/.test(t)) return ansComite(w);
  return ansHelp(w);
}

function ansStation(w, st) {
  const objs = w.objects.filter((o) => o.st === st.id);
  const res = stReserves(w, st.id), bl = res.filter((r) => r.sev === 'bloquante');
  const miss = {}; let nMiss = 0;
  objs.forEach((o) => o.docs.forEach((d) => { if (d.s !== 'ok') { nMiss++; const k = famById(o.fam).label; miss[k] = (miss[k] || 0) + 1; } }));
  const topMiss = Object.entries(miss).sort((a, b) => b[1] - a[1]).slice(0, 2);
  const vis = w.visas.filter((v) => v.st === st.id && !visaDone(v));
  const greys = w.greyZones.filter((g) => g.st === st.id && !g.done);
  const ready = stReady(w, st.id);

/* ---------- Évènements ---------- */
function init() {
  try { const t = localStorage.getItem('temoin-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) { /* stockage indisponible */ }
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-a]');
    if (!el) { if (S.menu && !e.target.closest('.menu')) { S.menu = false; renderTop(); } return; }
    const a = el.dataset.a;
    if (ACT[a]) { e.preventDefault(); if (a !== 'personaMenu' && a !== 'persona' && S.menu) S.menu = false; ACT[a](el.dataset, el); }
  });
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#q')?.focus(); return; }
    if (e.key === 'Escape') { closeAll(); return; }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-a], tr[data-a]')) { e.preventDefault(); e.target.click(); }
    if (e.key === 'Enter' && e.target.id === 'q') { S.objF = { ...OBJF(), q: e.target.value }; S.objLimit = 60; go('objets'); }
  });
  let tm;
  document.addEventListener('input', (e) => {
    if (e.target.dataset.in === 'objq') {
      clearTimeout(tm); const v = e.target.value;
      tm = setTimeout(() => { S.objF.q = v; S.objLimit = 60; renderMain(); const i = $('#objq'); if (i) { i.focus(); i.setSelectionRange(v.length, v.length); } }, 180);
    }
  });
  document.addEventListener('change', (e) => { const k = e.target.dataset.ch; if (k) { S.objF[k] = e.target.value; S.objLimit = 60; renderMain(); } });
  document.addEventListener('submit', (e) => { if (e.target.id === 'composer') { e.preventDefault(); const i = $('#cq'); const v = i.value; i.value = ''; sendChat(v); } });
  render();
}
