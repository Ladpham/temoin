<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Témoin Passation</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Maquette de démonstration : jumeau de passation des lignes du Grand Paris Express, côté IDFM. Structure réelle, chiffres et personnes fictifs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout : barre de ligne en haut, rail de modules à gauche, plan de travail au centre, tiroirs à droite (fiche objet, copilote). */
:root {
  --bg: #ECEFEE;
  --surface: #FFFFFF;
  --surface-2: #F5F7F6;
  --sunken: #E3E8E6;
  --ink: #121B22;
  --ink-2: #3A4750;
  --muted: #66737C;
  --hair: #D5DBD9;
  --hair-2: #E5E9E8;
  --primary: #121B22;
  --on-primary: #FFFFFF;
  --ok: #1B8457;
  --warn: #A66C00;
  --crit: #C8381F;
  --info: #2F5FC4;
  --g-gi: #1D7488;
  --g-exp: #7650A0;
  --g-idfm: #2F5DB8;
  --g-ville: #3B8A37;
  --g-dep: #97780F;
  --g-conc: #B05C27;
  --g-sgp: #6C7880;
  --line: #B90845;
  --line-ink: var(--line-ink-l, #A1083D);
  --map-water: #CFE1EA;
  --map-land: #E6EBE9;
  --shadow: 0 1px 2px rgba(18, 27, 34, .05), 0 10px 30px rgba(18, 27, 34, .07);
  --shadow-lg: 0 24px 60px rgba(18, 27, 34, .18);
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 10px;
  --r-sm: 6px;
  --rail: 236px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1316; --surface: #151C20; --surface-2: #1A2227; --sunken: #10171A;
    --ink: #E7EDEF; --ink-2: #BAC6CC; --muted: #85939A; --hair: #29343B; --hair-2: #212B31;
    --primary: #E7EDEF; --on-primary: #0E1316;
    --ok: #3DBB82; --warn: #E0A43A; --crit: #F06A4E; --info: #7CA2F2;
    --g-gi: #4FB3C8; --g-exp: #B08ED6; --g-idfm: #7D9EEA; --g-ville: #78C26E; --g-dep: #D2B04A; --g-conc: #E1925A; --g-sgp: #9AA6AE;
    --map-water: #1B3340; --map-land: #182024;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    --shadow-lg: 0 24px 60px rgba(0,0,0,.5);
    --line-ink: var(--line-ink-d, #F2789F);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1316; --surface: #151C20; --surface-2: #1A2227; --sunken: #10171A;
  --ink: #E7EDEF; --ink-2: #BAC6CC; --muted: #85939A; --hair: #29343B; --hair-2: #212B31;
  --primary: #E7EDEF; --on-primary: #0E1316;
  --ok: #3DBB82; --warn: #E0A43A; --crit: #F06A4E; --info: #7CA2F2;
  --g-gi: #4FB3C8; --g-exp: #B08ED6; --g-idfm: #7D9EEA; --g-ville: #78C26E; --g-dep: #D2B04A; --g-conc: #E1925A; --g-sgp: #9AA6AE;
  --map-water: #1B3340; --map-land: #182024;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  --shadow-lg: 0 24px 60px rgba(0,0,0,.5);
  --line-ink: var(--line-ink-d, #F2789F);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 14px/1.5 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--line); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.mono { font-family: var(--f-mono); font-size: 12px; letter-spacing: -.01em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .crit { color: var(--crit); }

/* ---------- Cadre de l'application */
.app {
  display: grid; height: 100%;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  grid-template-rows: 60px minmax(0, 1fr);
}
.top {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 18px;
  padding-inline: 18px; background: var(--surface); border-bottom: 1px solid var(--hair);
  position: relative; z-index: 5;
}
.brand { display: flex; align-items: center; gap: 10px; width: calc(var(--rail) - 18px); flex-shrink: 0; }
.brand-mark { width: 30px; height: 30px; flex-shrink: 0; }
.brand-name { font: 800 19px/1 var(--f-display); font-variation-settings: "wdth" 118; letter-spacing: -.02em; }
.brand-sub { font-size: 11px; color: var(--muted); line-height: 1.2; margin-top: 3px; }

.lines { display: flex; gap: 4px; padding: 4px; background: var(--surface-2); border: 1px solid var(--hair-2); border-radius: 999px; }
.line-btn {
  display: flex; align-items: center; gap: 7px; border: 0; background: transparent; border-radius: 999px;
  padding: 5px 11px 5px 5px; color: var(--ink-2); font-weight: 500; font-size: 13px; white-space: nowrap;
}
.line-btn:hover { background: var(--surface); }
.line-btn[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
.roundel {
  --c: var(--line); display: inline-grid; place-items: center; flex-shrink: 0;
  width: 24px; height: 24px; border-radius: 50%; background: var(--c); color: #fff;
  font: 800 11px/1 var(--f-display); font-variation-settings: "wdth" 90; letter-spacing: -.02em;
}
.roundel.lg { width: 34px; height: 34px; font-size: 15px; }
.roundel.xl { width: 46px; height: 46px; font-size: 20px; }
.roundel.dark-text { color: #1b1b1b; }

.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.search {
  display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; width: 250px;
  border: 1px solid var(--hair); border-radius: 8px; background: var(--surface-2); color: var(--muted);
}
.search input { border: 0; outline: 0; background: transparent; width: 100%; color: var(--ink); }
.kbd { font: 500 11px var(--f-mono); border: 1px solid var(--hair); border-radius: 4px; padding: 1px 5px; color: var(--muted); background: var(--surface); }
.persona-btn {
  display: flex; align-items: center; gap: 9px; border: 1px solid var(--hair); background: var(--surface);
  border-radius: 999px; padding: 3px 12px 3px 3px; max-width: 260px;
}
.persona-btn .who { text-align: left; line-height: 1.15; min-width: 0; }
.persona-btn .who b { display: block; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.persona-btn .who span { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn-ai {
  display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border: 0; border-radius: 8px;
  background: var(--primary); color: var(--on-primary); font-weight: 600;
}
.btn-ai svg { color: var(--line); }

/* ---------- Rail */
.rail {
  background: var(--surface); border-right: 1px solid var(--hair); padding: 14px 12px;
  display: flex; flex-direction: column; gap: 2px; overflow-y: auto;
}
.rail-sec { font: 600 10.5px/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 16px 10px 8px; }
.rail-sec:first-child { padding-top: 4px; }
.nav {
  display: flex; align-items: center; gap: 11px; width: 100%; border: 0; background: transparent;
  padding: 8px 10px; border-radius: 8px; color: var(--ink-2); font-weight: 500; text-align: left; position: relative;
}
.nav svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--muted); }
.nav:hover { background: var(--surface-2); color: var(--ink); }
.nav[aria-current="page"] { background: color-mix(in srgb, var(--line) 10%, var(--surface)); color: var(--ink); font-weight: 600; }
.nav[aria-current="page"] svg { color: var(--line-ink); }
.nav .count {
  margin-left: auto; font: 600 11px/1 var(--f-body); padding: 4px 7px; border-radius: 999px;
  background: var(--sunken); color: var(--ink-2); font-variant-numeric: tabular-nums;
}
.nav .count.hot { background: var(--crit); color: #fff; }
.rail-foot { margin-top: auto; padding: 14px 10px 4px; border-top: 1px solid var(--hair-2); display: grid; gap: 10px; }
.mock-tag {
  display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--warn);
  background: color-mix(in srgb, var(--warn) 12%, var(--surface)); border-radius: 6px; padding: 6px 8px; line-height: 1.35;
}
.link-btn { border: 0; background: none; padding: 0; color: var(--muted); font-size: 12px; text-decoration: underline; text-underline-offset: 3px; text-align: left; }
.link-btn:hover { color: var(--ink); }

/* ---------- Plan de travail */
.main { overflow-y: auto; overflow-x: hidden; min-width: 0; }
.view { padding: 26px 30px 60px; max-width: 1480px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; animation: rise .28s ease-out; }
@keyframes rise { from { transform: translateY(6px); opacity: .6; } to { transform: none; opacity: 1; } }
.page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-head .titles { min-width: 0; flex: 1 1 340px; }
.eyebrow { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
.eyebrow .roundel { width: 20px; height: 20px; font-size: 10px; }
h1 { font: 700 30px/1.08 var(--f-display); font-variation-settings: "wdth" 112; letter-spacing: -.025em; }
h2 { font: 700 17px/1.2 var(--f-display); font-variation-settings: "wdth" 105; letter-spacing: -.01em; }
h3 { font: 600 11px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.lede { color: var(--ink-2); max-width: 70ch; margin-top: 6px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.btn {
  display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 8px;
  border: 1px solid var(--hair); background: var(--surface); color: var(--ink); font-weight: 500; font-size: 13px; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn svg { width: 15px; height: 15px; }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn.primary:hover { opacity: .9; }
.btn.line { background: var(--line); border-color: var(--line); color: var(--on-line, #fff); font-weight: 600; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 6px; }
.btn[disabled] { opacity: .45; cursor: default; }

.card { background: var(--surface); border: 1px solid var(--hair-2); border-radius: var(--r); padding: 18px 20px; min-width: 0; }
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.card-head .sp { margin-left: auto; }
.grid { display: grid; gap: 18px; }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.65fr) minmax(320px, 1fr); }
.g-main-r { grid-template-columns: minmax(300px, .9fr) minmax(0, 1.7fr); }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; background: var(--surface); border: 1px solid var(--hair-2); border-radius: var(--r); }
.kpis.k5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.kpis.k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi { padding: 16px 18px; border-left: 1px solid var(--hair-2); min-width: 0; }
.kpi:first-child { border-left: 0; }
.kpi .lbl { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.kpi .val { font: 700 28px/1.1 var(--f-display); font-variation-settings: "wdth" 100; letter-spacing: -.02em; margin-top: 6px; font-variant-numeric: tabular-nums; }
.kpi .val small { font: 500 14px var(--f-body); color: var(--muted); margin-left: 2px; letter-spacing: 0; }
.kpi .sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
.kpi .delta { font-weight: 600; }

/* Puces d'état */
.pill {
  --c: var(--muted); display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px;
  font-size: 11.5px; font-weight: 600; white-space: nowrap; color: var(--c);
  background: color-mix(in srgb, var(--c) 13%, var(--surface));
}
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.pill.ok { --c: var(--ok); } .pill.warn { --c: var(--warn); } .pill.crit { --c: var(--crit); } .pill.info { --c: var(--info); }
.pill.line { --c: var(--line-ink); }
.pill.outline { background: transparent; border: 1px solid var(--hair); color: var(--ink-2); font-weight: 500; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c, var(--muted)); flex-shrink: 0; }
.gest { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; white-space: nowrap; }

/* Barres */
.bar { height: 6px; border-radius: 99px; background: var(--sunken); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--c, var(--line)); transition: width .5s ease; }
.bar.lg { height: 9px; }
.stack { display: flex; height: 9px; border-radius: 99px; overflow: hidden; background: var(--sunken); gap: 2px; }
.stack > i { display: block; height: 100%; }

/* Avatars */
.av {
  --c: var(--g-sgp); width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; display: inline-grid; place-items: center;
  background: color-mix(in srgb, var(--c) 18%, var(--surface)); color: var(--c);
  font: 700 10.5px/1 var(--f-body); border: 1.5px solid color-mix(in srgb, var(--c) 45%, var(--surface));
}
.av.sm { width: 22px; height: 22px; font-size: 9px; }
.av.lg { width: 38px; height: 38px; font-size: 13px; }
.av-row { display: flex; }
.av-row .av { margin-left: -6px; box-shadow: 0 0 0 2px var(--surface); }
.av-row .av:first-child { margin-left: 0; }
.av-wrap { position: relative; display: inline-flex; }
.av-wrap .st { position: absolute; right: -3px; bottom: -3px; width: 13px; height: 13px; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--surface); }
.av-wrap .st svg { width: 9px; height: 9px; color: #fff; }

/* Tableaux */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--hair-2); border-radius: var(--r); background: var(--surface); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th {
  text-align: left; font: 600 11px/1.2 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
  padding: 11px 12px; border-bottom: 1px solid var(--hair); background: var(--surface-2); white-space: nowrap; position: sticky; top: 0;
}
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--hair-2); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr { cursor: pointer; }
.tbl tbody tr:hover td { background: color-mix(in srgb, var(--line) 4%, var(--surface)); }
.tbl tr.sel td { background: color-mix(in srgb, var(--line) 8%, var(--surface)); }
.tbl .r { text-align: right; font-variant-numeric: tabular-nums; }
.tbl .nowrap { white-space: nowrap; }
.tbl .t-main { font-weight: 600; }
.tbl .t-sub { font-size: 12px; color: var(--muted); }

/* Filtres & onglets */
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--sunken); border-radius: 8px; }
.seg button { border: 0; background: transparent; border-radius: 6px; padding: 5px 11px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); font-weight: 600; }
select.sel {
  height: 32px; border: 1px solid var(--hair); border-radius: 7px; background: var(--surface); padding: 0 28px 0 10px; font-size: 12.5px;
  appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 14px) 13px, calc(100% - 9px) 13px; background-size: 5px 5px; background-repeat: no-repeat;
}
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--hair);
  background: var(--surface); font-size: 12.5px; color: var(--ink-2); white-space: nowrap;
}
.chip[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--ink); font-weight: 600; }

/* ---------- Ma journée */
.hello { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); gap: 18px; }
.brief {
  position: relative; overflow: hidden; border-radius: 14px; padding: 22px 24px; color: #F2F5F6;
  background: #13202A;
}
.brief::after {
  content: ""; position: absolute; right: -110px; top: -130px; width: 300px; height: 300px; border-radius: 50%;
  border: 28px solid var(--line); opacity: .95;
}
.brief::before {
  content: ""; position: absolute; right: 40px; bottom: -70px; width: 150px; height: 150px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.14);
}
.brief > * { position: relative; z-index: 1; }
.brief .ai-tag { display: inline-flex; gap: 6px; align-items: center; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: #C9D3D8; }
.brief h2 { color: #fff; font-size: 24px; margin: 10px 0 10px; max-width: min(27ch, calc(100% - 220px)); font-variation-settings: "wdth" 110; }
.brief p { color: #D2DBDF; max-width: min(58ch, calc(100% - 200px)); line-height: 1.6; }
.brief p b { color: #fff; font-weight: 600; }
.brief .brief-stats { display: flex; gap: 26px; margin-top: 18px; flex-wrap: wrap; }
.brief .brief-stats div { font-size: 12px; color: #AAB8BF; }
.brief .brief-stats b { display: block; font: 700 22px/1.1 var(--f-display); color: #fff; font-variant-numeric: tabular-nums; }
.brief .btn { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.18); color: #fff; }
.brief .btn:hover { background: rgba(255,255,255,.14); }

.countdown { display: grid; gap: 12px; align-content: start; }
.cd-big { display: flex; align-items: baseline; gap: 10px; }
.cd-big b { font: 800 54px/1 var(--f-display); font-variation-settings: "wdth" 80; letter-spacing: -.03em; font-variant-numeric: tabular-nums; color: var(--line-ink); }

.prio { display: grid; gap: 0; }
.prio-item { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 12px; padding: 14px 0; border-top: 1px solid var(--hair-2); align-items: start; }
.prio-item:first-child { border-top: 0; padding-top: 2px; }
.prio-rank { font: 700 13px/26px var(--f-display); color: var(--muted); text-align: center; border-radius: 50%; background: var(--surface-2); width: 26px; height: 26px; }
.prio-item .t { font-weight: 600; }
.prio-item .why { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.prio-item .meta { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
.prio-item .go { display: flex; gap: 6px; }

.domain-row { display: grid; grid-template-columns: 170px minmax(0, 1fr) 46px; gap: 12px; align-items: center; padding: 7px 0; }
.domain-row .n { font-size: 13px; }
.domain-row .v { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 13px; }

.agenda-item { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; padding: 11px 0; border-top: 1px solid var(--hair-2); }
.agenda-item:first-child { border-top: 0; padding-top: 0; }
.agenda-item .h { font: 600 13px var(--f-mono); color: var(--ink-2); padding-top: 1px; }
.agenda-item .t { font-weight: 600; font-size: 13.5px; }
.agenda-item .s { font-size: 12px; color: var(--muted); }

.feed { display: grid; gap: 0; }
.feed-item { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; padding: 10px 0; border-top: 1px solid var(--hair-2); align-items: start; font-size: 13px; }
.feed-item:first-child { border-top: 0; }
.feed-item .when { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.feed-item.fresh { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: color-mix(in srgb, var(--line) 16%, transparent); } to { background: transparent; } }

/* ---------- Jalons */
.milestones { position: relative; padding: 32px 4px 6px; }
.ms-track { position: relative; height: 4px; background: var(--sunken); border-radius: 4px; margin: 0 8px; }
.ms-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--line); border-radius: 4px; }
.ms { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 3px solid var(--sunken); }
.ms.done { border-color: var(--line); background: var(--line); }
.ms.now { border-color: var(--line); box-shadow: 0 0 0 5px color-mix(in srgb, var(--line) 22%, transparent); }
.ms-lbl { position: absolute; top: 16px; transform: translateX(-50%); font-size: 11.5px; text-align: center; width: 110px; line-height: 1.3; color: var(--ink-2); }
.ms-lbl b { display: block; font: 500 10.5px var(--f-mono); color: var(--muted); }
.ms-today { position: absolute; top: -26px; transform: translateX(-50%); font: 600 10.5px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--line-ink); white-space: nowrap; }
.ms-today::after { content: ""; position: absolute; left: 50%; top: 16px; width: 1px; height: 12px; background: var(--line); }

/* ---------- Frise des jalons */
.mstep { position: relative; padding-top: 30px; }
.mstep-rail { position: absolute; top: 39px; left: calc(100% / (var(--n) * 2)); right: calc(100% / (var(--n) * 2)); height: 4px; border-radius: 4px; background: var(--sunken); }
.mstep-rail > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--line); }
.mstep-today { position: absolute; top: -30px; transform: translateX(-50%); font: 600 10.5px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--line-ink); white-space: nowrap; }
.mstep-today::after { content: ""; position: absolute; left: 50%; top: 15px; width: 2px; height: 10px; background: var(--line); }
.mstep-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); position: relative; }
.mstep-list li { display: grid; justify-items: center; align-content: start; gap: 3px; text-align: center; padding-inline: 5px; font-size: 12px; color: var(--ink-2); }
.mstep-list .dot { width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 3px solid var(--sunken); display: grid; place-items: center; margin-bottom: 6px; }
.mstep-list .dot svg { width: 12px; height: 12px; color: var(--on-line, #fff); stroke-width: 3; }
.mstep-list li.done .dot { background: var(--line); border-color: var(--line); }
.mstep-list li.now .dot { border-color: var(--line); box-shadow: 0 0 0 5px color-mix(in srgb, var(--line) 22%, transparent); }
.mstep-list b { font: 500 11px var(--f-mono); color: var(--muted); }
.mstep-list .l { font-weight: 600; color: var(--ink); line-height: 1.3; text-wrap: balance; }
.mstep-list li.done .l { color: var(--ink-2); font-weight: 500; }
.mstep-list .nt { font-size: 11px; color: var(--muted); line-height: 1.3; }

/* ---------- Exposition par gare */
.ebars { display: grid; gap: 4px; }
.ebar { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr) 72px; gap: 12px; align-items: center; border: 0; background: none; padding: 6px 4px; border-radius: 6px; text-align: left; }
.ebar:hover { background: var(--surface-2); }
.ebar .n { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ebar .b { height: 10px; border-radius: 99px; background: var(--sunken); overflow: hidden; }
.ebar .b i { display: block; height: 100%; border-radius: 99px; background: color-mix(in srgb, var(--crit) 75%, var(--surface)); }
.ebar .v { text-align: right; font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
table.tbl.wide { min-width: 1180px; }

/* ---------- Jumeau */
.twin { display: grid; grid-template-columns: minmax(0, 1fr) 350px; background: var(--surface); border: 1px solid var(--hair-2); border-radius: 14px; overflow: hidden; }
.twin-stage { position: relative; min-width: 0; min-height: 540px; display: flex; flex-direction: column; justify-content: center; padding-block: 52px 56px; background:
  radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--ink) 9%, transparent) 1px, transparent 0) 0 0 / 22px 22px,
  var(--surface-2); }
.twin-stage svg { display: block; width: 100%; height: auto; }
.twin-float { position: absolute; left: 16px; top: 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; right: 16px; pointer-events: none; }
.twin-float > * { pointer-events: auto; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--hair-2); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; box-shadow: var(--shadow); }
.crumbs button { border: 0; background: none; padding: 0; color: var(--muted); }
.crumbs button:hover { color: var(--ink); text-decoration: underline; }
.crumbs b { font-weight: 600; }
.legend { position: absolute; left: 16px; bottom: 14px; right: 16px; display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--hair-2); border-radius: 8px; padding: 8px 12px; backdrop-filter: blur(6px); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.twin-panel { border-left: 1px solid var(--hair-2); position: relative; min-width: 0; }
.twin-panel-inner { position: absolute; inset: 0; overflow-y: auto; padding: 20px; display: grid; gap: 16px; align-content: start; }
.kv { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--hair-2); font-size: 13px; gap: 10px; }
.kv:last-child { border-bottom: 0; }
.kv b { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }

.st-node { cursor: pointer; }
.st-node .halo { opacity: 0; transition: opacity .15s; }
.st-node:hover .halo, .st-node.sel .halo { opacity: 1; }
.st-label { font: 600 17px var(--f-display); font-variation-settings: "wdth" 80; fill: var(--ink); letter-spacing: .005em; }
.st-sub { font: 500 13px var(--f-body); fill: var(--muted); }
.zone { cursor: pointer; transition: opacity .15s, filter .15s; }
.zone:hover { filter: brightness(1.04) saturate(1.1); }
.zone.dim { opacity: .28; }
.eq { cursor: pointer; }
.eq:hover circle { stroke-width: 3; }
.svg-txt { font: 600 11px var(--f-body); fill: var(--ink); }
.svg-txt-m { font: 500 10px var(--f-mono); fill: var(--ink-2); }
.svg-cap { font: 600 10px var(--f-body); letter-spacing: .12em; fill: var(--muted); text-transform: uppercase; }
.train-move { animation: train 9s linear infinite; }
@keyframes train { 0% { transform: translateX(-260px); } 45%, 55% { transform: translateX(240px); } 100% { transform: translateX(820px); } }
@media (prefers-reduced-motion: reduce) { .train-move, .view, .feed-item.fresh { animation: none; } }

/* Pipeline d'état des objets */
.pipeline { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.pipe {
  position: relative; border: 1px solid var(--hair-2); background: var(--surface); padding: 12px 14px 12px 18px; text-align: left;
  border-radius: 8px; display: grid; gap: 2px;
}
.pipe::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 4px; border-radius: 0 4px 4px 0; background: var(--c); }
.pipe .n { font: 700 24px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.pipe .l { font-size: 12px; color: var(--muted); }
.pipe[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.steps { display: flex; align-items: center; gap: 3px; }
.steps i { width: 14px; height: 5px; border-radius: 3px; background: var(--sunken); }
.steps i.on { background: var(--c, var(--ok)); }

/* ---------- Tiroirs */
.scrim { position: fixed; inset: 0; background: rgba(10, 16, 20, .32); z-index: 40; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--surface); z-index: 41;
  box-shadow: var(--shadow-lg); display: flex; flex-direction: column; animation: slide .26s cubic-bezier(.2,.8,.2,1);
}
.drawer.wide { width: min(760px, 100vw); }
@keyframes slide { from { transform: translateX(40px); opacity: .4; } }
.drawer-head { padding: 18px 22px 14px; border-bottom: 1px solid var(--hair-2); display: grid; gap: 6px; }
.drawer-head .row { display: flex; align-items: center; gap: 10px; }
.drawer-head h2 { font-size: 21px; }
.x { margin-left: auto; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--hair); background: var(--surface); display: grid; place-items: center; flex-shrink: 0; }
.x svg { width: 16px; height: 16px; }
.drawer-body { overflow-y: auto; padding: 18px 22px 30px; display: grid; gap: 20px; align-content: start; }
.sec { display: grid; gap: 10px; }

.lifecycle { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.lc { position: relative; text-align: center; font-size: 11.5px; color: var(--muted); padding-top: 26px; }
.lc::before { content: ""; position: absolute; top: 9px; left: 0; right: 0; height: 3px; background: var(--sunken); }
.lc:first-child::before { left: 50%; } .lc:last-child::before { right: 50%; }
.lc.done::before { background: var(--ok); }
.lc .dot { position: absolute; top: 3px; left: 50%; transform: translateX(-50%); width: 15px; height: 15px; border-radius: 50%; background: var(--surface); border: 3px solid var(--sunken); }
.lc.done .dot { background: var(--ok); border-color: var(--ok); }
.lc.cur { color: var(--ink); font-weight: 600; }
.lc.cur .dot { border-color: var(--ok); }

.doc-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--hair-2); font-size: 13px; }
.doc-row:last-child { border-bottom: 0; }
.check { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; }
.check svg { width: 12px; height: 12px; }
.check.ok { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); color: var(--ok); }
.check.no { background: color-mix(in srgb, var(--crit) 14%, var(--surface)); color: var(--crit); }
.check.wait { background: color-mix(in srgb, var(--warn) 16%, var(--surface)); color: var(--warn); }

.timeline { display: grid; gap: 0; }
.tl { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 12px; padding-bottom: 14px; position: relative; font-size: 13px; }
.tl::before { content: ""; position: absolute; left: 6px; top: 14px; bottom: 0; width: 2px; background: var(--hair-2); }
.tl:last-child::before { display: none; }
.tl i { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--c, var(--muted)); background: var(--surface); margin-top: 3px; }
.tl .d { font-size: 11.5px; color: var(--muted); }

.note-ai {
  border-radius: 10px; padding: 14px 16px; font-size: 13px; line-height: 1.6; color: var(--ink-2);
  background: color-mix(in srgb, var(--line) 6%, var(--surface)); border: 1px solid color-mix(in srgb, var(--line) 20%, var(--surface));
}
.note-ai .h { display: flex; gap: 6px; align-items: center; font: 600 11px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--line-ink); margin-bottom: 6px; }
.note-ai b { color: var(--ink); }

/* ---------- Copilote */
.copilot { width: min(470px, 100vw); }
.copilot .drawer-head { background: #13202A; color: #fff; border-bottom: 0; }
.copilot .drawer-head .x { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.16); color: #fff; }
.copilot .drawer-head .small { color: #AEBCC3; }
.chat { flex: 1; overflow-y: auto; padding: 18px 20px; display: grid; gap: 14px; align-content: start; background: var(--surface-2); }
.msg { max-width: 92%; padding: 11px 14px; border-radius: 12px; font-size: 13.5px; line-height: 1.55; }
.msg.me { justify-self: end; background: var(--primary); color: var(--on-primary); border-bottom-right-radius: 4px; }
.msg.ai { background: var(--surface); border: 1px solid var(--hair-2); border-bottom-left-radius: 4px; }
.msg.ai ul { margin: 6px 0 0; padding-left: 18px; }
.msg.ai li { margin: 3px 0; }
.msg .srcs { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--hair); }
.src { font-size: 11px; border: 1px solid var(--hair); border-radius: 5px; padding: 2px 6px; color: var(--ink-2); background: var(--surface-2); display: inline-flex; gap: 4px; align-items: center; }
.msg .acts { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.typing { display: inline-flex; gap: 4px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 50% { opacity: .2; } }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 20px 0; background: var(--surface); border-top: 1px solid var(--hair-2); }
.suggest button { border: 1px solid var(--hair); background: var(--surface); border-radius: 999px; font-size: 12px; padding: 5px 10px; color: var(--ink-2); text-align: left; }
.suggest button:hover { border-color: var(--line); color: var(--ink); }
.composer { display: flex; gap: 8px; padding: 12px 20px 18px; background: var(--surface); }
.composer input { flex: 1; height: 40px; border: 1px solid var(--hair); border-radius: 9px; padding: 0 12px; background: var(--surface-2); outline: none; }
.composer input:focus { border-color: var(--line); }

/* ---------- Courriers */
.mail { display: grid; grid-template-columns: 380px minmax(0, 1fr); background: var(--surface); border: 1px solid var(--hair-2); border-radius: 14px; overflow: hidden; min-height: 640px; }
.mail-list { border-right: 1px solid var(--hair-2); overflow-y: auto; max-height: 780px; }
.mail-item { display: grid; gap: 4px; padding: 14px 16px; border-bottom: 1px solid var(--hair-2); cursor: pointer; border-left: 3px solid transparent; }
.mail-item:hover { background: var(--surface-2); }
.mail-item.sel { background: color-mix(in srgb, var(--line) 6%, var(--surface)); border-left-color: var(--line); }
.mail-item.done { opacity: .62; }
.mail-item .from { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
.mail-item .from b { font-weight: 600; }
.mail-item .when { margin-left: auto; font-size: 11.5px; color: var(--muted); }
.mail-item .subj { font-weight: 600; font-size: 13.5px; line-height: 1.35; }
.mail-item .prev { font-size: 12.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mail-read { padding: 22px 26px; overflow-y: auto; max-height: 780px; display: grid; gap: 18px; align-content: start; }
.mail-body { font-size: 13.5px; line-height: 1.7; color: var(--ink-2); white-space: pre-line; background: var(--surface-2); border-radius: 10px; padding: 16px 18px; }
.extract { border: 1px solid var(--hair); border-radius: 12px; overflow: hidden; }
.extract-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: color-mix(in srgb, var(--line) 6%, var(--surface)); border-bottom: 1px solid var(--hair-2); }
.extract-head b { font-size: 13px; }
.ex-row { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 16px; border-bottom: 1px solid var(--hair-2); font-size: 13px; }
.ex-row:last-child { border-bottom: 0; }
.diff { font-family: var(--f-mono); font-size: 12px; }
.diff s { color: var(--crit); text-decoration-thickness: 1px; }
.diff ins { color: var(--ok); text-decoration: none; font-weight: 600; }
.draft { border: 1px dashed var(--hair); border-radius: 10px; padding: 14px 16px; font-size: 13px; line-height: 1.65; white-space: pre-line; background: var(--surface); }

.wave { display: flex; align-items: center; gap: 2px; height: 46px; }
.wave i { width: 3px; border-radius: 2px; background: color-mix(in srgb, var(--line) 55%, var(--surface)); }
.wave i.p { background: var(--line); }

/* ---------- Matrice */
.matrix { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
.matrix th { font: 600 11px/1.25 var(--f-body); color: var(--ink-2); padding: 10px 8px; text-align: center; vertical-align: bottom; border-bottom: 1px solid var(--hair); background: var(--surface); position: sticky; top: 0; }
.matrix th:first-child { text-align: left; }
.matrix td { border-bottom: 1px solid var(--hair-2); padding: 7px 8px; text-align: center; }
.matrix td:first-child { text-align: left; padding-left: 14px; }
.matrix tr:hover td { background: var(--surface-2); }
.matrix tr { cursor: pointer; }
.cell {
  display: inline-grid; place-items: center; min-width: 30px; height: 26px; padding: 0 6px; border-radius: 6px;
  font: 700 11px/1 var(--f-mono); color: var(--c); background: color-mix(in srgb, var(--c) 15%, var(--surface));
}
.cell.r { background: var(--c); color: #fff; }
.cell.q {
  color: var(--crit); background: repeating-linear-gradient(45deg, color-mix(in srgb, var(--crit) 16%, var(--surface)) 0 4px, var(--surface) 4px 8px);
  border: 1px solid color-mix(in srgb, var(--crit) 50%, var(--surface));
}

/* ---------- Visas */
.visa-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.visa-card { display: grid; gap: 10px; padding: 16px 18px; border: 1px solid var(--hair-2); border-radius: 12px; background: var(--surface); cursor: pointer; }
.visa-card:hover { border-color: var(--hair); box-shadow: var(--shadow); }
.visa-card .top-row { display: flex; gap: 8px; align-items: center; }
.visa-card .t { font-weight: 600; font-size: 14px; line-height: 1.35; }
.circuit { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.circuit .arrow { width: 10px; height: 1px; background: var(--hair); }
.receipt { overflow-x: auto; }
.receipt table { border-collapse: collapse; font-size: 12px; }
.receipt th { font-weight: 500; color: var(--muted); padding: 6px; white-space: nowrap; }
.receipt th.rot { height: 120px; vertical-align: bottom; }
.receipt th.rot > div { transform: rotate(-50deg); transform-origin: left bottom; width: 26px; white-space: nowrap; translate: 12px 0; }
.receipt td { padding: 4px; text-align: center; border-top: 1px solid var(--hair-2); }
.receipt td:first-child { text-align: left; padding-right: 12px; white-space: nowrap; font-weight: 500; }
.rc { width: 22px; height: 22px; border-radius: 6px; display: inline-grid; place-items: center; }
.rc svg { width: 12px; height: 12px; }

/* ---------- Équipe */
.net { background: var(--surface); border: 1px solid var(--hair-2); border-radius: 14px; overflow: hidden; }
.net svg { display: block; width: 100%; height: auto; }
.net .node { cursor: pointer; }
.persona-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.pc { text-align: left; border: 1px solid var(--hair-2); background: var(--surface); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; }
.pc:hover { border-color: var(--hair); box-shadow: var(--shadow); }
.pc[aria-pressed="true"] { border-color: var(--line); box-shadow: inset 0 0 0 1px var(--line); }
.pc .who { display: flex; gap: 10px; align-items: center; }
.pc .who b { display: block; font-size: 13.5px; }
.pc .who span { font-size: 12px; color: var(--muted); }
.pc p { font-size: 12.5px; color: var(--ink-2); }
.scale { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: 1px solid var(--hair-2); border-radius: 12px; overflow: hidden; background: var(--surface); }
.scale > div { padding: 16px 18px; border-left: 1px solid var(--hair-2); display: grid; gap: 6px; align-content: start; }
.scale > div:first-child { border-left: 0; }
.scale .n { font: 800 30px/1 var(--f-display); font-variation-settings: "wdth" 85; color: var(--line-ink); }
.scale .t { font-weight: 600; }
.scale p { font-size: 12.5px; color: var(--muted); }

/* ---------- Portefeuille */
.lines-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.line-card { position: relative; text-align: left; border: 1px solid var(--hair-2); background: var(--surface); border-radius: 14px; padding: 18px; display: grid; gap: 12px; overflow: hidden; }
.line-card:hover { box-shadow: var(--shadow); border-color: var(--hair); }
.line-card.cur { box-shadow: inset 0 0 0 2px var(--lc); border-color: transparent; }
.line-card .stripe { position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--lc); }
.line-card .hd { display: flex; gap: 12px; align-items: center; }
.line-card .hd b { font: 700 17px var(--f-display); font-variation-settings: "wdth" 105; }
.line-card .term { font-size: 12px; color: var(--muted); }
.line-card .hd > div { min-width: 0; }
.pill.wrap { white-space: normal; height: auto; padding-block: 3px; line-height: 1.35; }
.mini-line { height: 22px; }
.heat td.h { width: 64px; height: 34px; text-align: center; font: 600 12px var(--f-body); font-variant-numeric: tabular-nums; border-radius: 6px; }

/* ---------- Toasts */
.toasts { position: fixed; right: 20px; bottom: 20px; display: grid; gap: 8px; z-index: 60; }
.toast {
  display: flex; align-items: center; gap: 10px; background: var(--primary); color: var(--on-primary); padding: 11px 14px;
  border-radius: 10px; font-size: 13px; box-shadow: var(--shadow-lg); animation: slide .25s; max-width: 420px;
}
.toast svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--ok); }

/* Les conteneurs défilants ne compriment pas leurs blocs */
.drawer-body, .mail-read, .twin-panel-inner, .chat { grid-auto-rows: max-content; }

/* ---------- Divers */
.empty { padding: 28px; text-align: center; color: var(--muted); font-size: 13px; }
.divider { height: 1px; background: var(--hair-2); }
.tag-ai { display: inline-flex; align-items: center; gap: 5px; font: 600 10.5px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--line-ink); }
.tag-ai svg { width: 12px; height: 12px; }
.ic { width: 16px; height: 16px; flex-shrink: 0; }
.stat-inline { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.stat-inline b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.menu { position: absolute; right: 0; top: 46px; width: 320px; background: var(--surface); border: 1px solid var(--hair); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 6px; z-index: 30; display: grid; gap: 2px; }
.menu button { display: flex; gap: 10px; align-items: center; border: 0; background: transparent; padding: 8px; border-radius: 8px; text-align: left; }
.menu button:hover { background: var(--surface-2); }
.menu button b { display: block; font-size: 13px; font-weight: 600; }
.menu button span { display: block; font-size: 11.5px; color: var(--muted); }
.menu .mh { font: 600 10.5px var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 8px 8px 4px; }
.rel { position: relative; }
.evm-legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; }
.evm-legend span { display: inline-flex; align-items: center; gap: 6px; }
.evm-legend i { width: 14px; height: 3px; border-radius: 2px; background: var(--c); }
.tree { display: grid; gap: 0; font-size: 13px; }
.tree-row { display: grid; grid-template-columns: minmax(0, 1fr) 120px 48px; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--hair-2); }
.tree-row.child { padding-left: 18px; color: var(--ink-2); }
.tree-row .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

/* ---------- Adaptation aux écrans plus étroits (usage principal : ordinateur) */
@media (max-width: 1280px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .kpi:nth-child(4) { border-left: 0; }
  .kpi:nth-child(n+4) { border-top: 1px solid var(--hair-2); }
  .search { width: 180px; }
  .lines-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 1100px) {
  :root { --rail: 72px; }
  .nav span.lbl, .rail-sec, .rail-foot, .nav .count, .brand-txt { display: none; }
  .nav { justify-content: center; }
  .brand { width: auto; }
  .g-main, .g-main-r, .hello, .twin, .mail, .visa-grid { grid-template-columns: minmax(0, 1fr); }
  .twin-panel { border-left: 0; border-top: 1px solid var(--hair-2); }
  .twin-panel-inner { position: static; }
  .mstep-list { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 14px; }
  .mstep-rail { display: none; }
  .search { display: none; }
  .persona-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); }
  .top { flex-wrap: wrap; padding-block: 10px; height: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .lines { order: 3; width: 100%; overflow-x: auto; }
  .rail { flex-direction: row; overflow-x: auto; padding: 6px 10px; border-right: 0; border-bottom: 1px solid var(--hair); }
  .nav { width: auto; }
  .view { padding: 18px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
  .kpis, .pipeline, .scale, .lines-grid, .persona-cards, .g-2, .g-3 { grid-template-columns: minmax(0, 1fr); }
  .kpi { border-left: 0; border-top: 1px solid var(--hair-2); }
  .persona-btn .who, .btn-ai span { display: none; }
  .page-head { align-items: flex-start; }
  .page-head .titles { flex-basis: 100%; }
  .page-head > .actions { flex: 1 1 100%; min-width: 0; }
  .kpis.k5 { grid-template-columns: minmax(0, 1fr); }
  .kpis.k4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpis.k4 .kpi:nth-child(odd) { border-left: 0; }
  .seg { max-width: 100%; overflow-x: auto; }
  h1 { font-size: 25px; }
  .brief { padding: 18px; }
  .brief::after { width: 150px; height: 150px; right: -66px; top: -76px; border-width: 16px; }
  .brief h2, .brief p { max-width: none; }
  .brief h2 { font-size: 20px; padding-right: 56px; }
  .cd-big b { font-size: 42px; }
  .prio-item { grid-template-columns: 26px minmax(0, 1fr); }
  .prio-item .go { grid-column: 2; }
  .domain-row { grid-template-columns: 112px minmax(0, 1fr) 40px; }
  .ebar { grid-template-columns: minmax(0, 120px) minmax(0, 1fr) 64px; }
  .twin-stage { min-height: 0; padding-block: 58px 10px; }
  .legend { position: static; margin: 0 10px 10px; }
  .mail-list { max-height: 380px; border-right: 0; border-bottom: 1px solid var(--hair-2); }
  .mail-read { padding: 18px 16px; }
  .ex-row { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .tree-row { grid-template-columns: minmax(0, 1fr) 80px 44px; }
  .drawer-head, .drawer-body { padding-inline: 16px; }
  .chat, .suggest, .composer { padding-inline: 14px; }
  .toasts { left: 12px; right: 12px; bottom: 12px; }
  .scale > div, .kpi { border-left: 0; }
}

function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const pad = (n) => String(n).padStart(2, '0');
function pickW(r, weights) { const s = weights.reduce((a, b) => a + b, 0); let x = r() * s; for (let i = 0; i < weights.length; i++) { x -= weights[i]; if (x <= 0) return i; } return weights.length - 1; }
const rint = (r, a, b) => a + Math.floor(r() * (b - a + 1));
const rbet = (r, a, b) => a + (b - a) * r();
const monthsBetween = (a, b) => (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());

function smoothPath(pts) {
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0]},${p2[1]}`;
  }
  return d;
}

function layoutStations(L, sts) {
  const pts = L.shape; const seg = []; let tot = 0;
  for (let i = 0; i < pts.length - 1; i++) { const d = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]); seg.push(d); tot += d; }
  const n = sts.length;
  sts.forEach((s, i) => {
    let t = (i / (n - 1)) * tot, k = 0;
    while (k < seg.length - 1 && t > seg[k]) { t -= seg[k]; k++; }
    const f = Math.min(1, t / seg[k]);
    s.x = Math.round(pts[k][0] + (pts[k + 1][0] - pts[k][0]) * f);
    s.y = Math.round(pts[k][1] + (pts[k + 1][1] - pts[k][1]) * f);
  });
}

/* ---------- Construction d'un monde (une ligne) ---------- */
const WORLDS = {};
function getWorld(id) { return WORLDS[id] || (WORLDS[id] = buildWorld(lineById(id))); }

function buildWorld(L) {
  const r = rng(L.seed);
  const sts = L.stations.map(([id, name, town, cx, shared, stage], idx) => ({ id, name, town, cx: cx || [], shared: shared || [], idx, stage }));
  layoutStations(L, sts);
  const w = { line: L, stations: sts, objects: [], reserves: [], lots: [], visas: [], mails: [], events: [], greyZones: [], conventions: [], agenda: [], objMap: new Map(), ver: 0 };
  w.line.decor = decorFor(L, sts);
  w.milestones = L.milestones.map(([date, label, done, note]) => ({ date, label, done, note }));

  // lots
  const defs = lotDefs(L, sts);
  defs.forEach((d, i) => {
    const endPlan = new Date(d.start.getTime() + (d.type === 'GC' ? 7.2 : 6) * 365 * DAY);
    const endF = new Date(Math.max(endPlan.getTime() + rint(r, 120, 520) * DAY, TODAY.getTime() + rint(r, 60, 380) * DAY));
    const over = d.type === 'GC' ? rbet(r, .04, .19) : rbet(r, .01, .12);
    const lot = { id: `${L.code}-${d.code}`, ...d, end: endPlan, endF, avenants: Math.round(d.budget * over), eac: Math.round(d.budget * (1 + over + rbet(r, 0, .03))), sgp: d.type === 'GC' ? 'iroux' : d.type === 'MR' ? 'pycaron' : d.type === 'ESP' ? 'kbenali' : 'pycaron', recv: d.type === 'MR' ? 'nhaddad' : d.type === 'ESP' ? 'hlambert' : 'agathe', gi: d.type === 'ESP' ? 'refcom' : d.type === 'MR' || d.type === 'CF' || d.type === 'CEX' ? 'epetit' : 'amercier' };
    lot.scope = d.st.length === sts.length ? 'toute la ligne' : d.st.length ? (d.st.length === 1 ? stOf(sts, d.st[0]).name : `${stOf(sts, d.st[0]).name} → ${stOf(sts, d.st[d.st.length - 1]).name}`) : d.type === 'MR' ? 'flotte de la ligne' : d.type === 'CEX' ? (L.depot ? L.depot.label : 'centre d’exploitation') : d.code === 'T2C' ? 'tunnel entre Noisy–Champs et Villiers–Champigny–Bry' : 'arrière-gare';
    lot.engagements = (ENGAGEMENTS[d.type] || ENGAGEMENTS.EQ).map(([l, target]) => { const k = d.prog < 30 ? 'verif' : ['ok', 'ok', 'ok', 'ecart', 'verif'][rint(r, 0, 4)]; return { l, target, ok: k, meas: ENG_MEAS[k][rint(r, 0, 2)], src: k === 'verif' ? 'programme d’essais' : ['PV d’essais', 'rapport du bureau de contrôle', 'note de calcul', 'relevés de chantier'][rint(r, 0, 3)] }; });
    lot.evm = mkEvm(r, lot);
    w.lots.push(lot);
  });
  const lotFor = (fam, st, tunIdx) => {
    const f = famById(fam);
    if (f.domain === 'GC') {
      if (tunIdx != null) { const t = w.lots.find((l) => l.tun && l.tun.includes(tunIdx)); if (t) return t; st = sts[Math.min(sts.length - 1, tunIdx + 1)].id; }
      return w.lots.find((l) => l.type === 'GC' && l.st.includes(st)) || w.lots[0];
    }
    return w.lots.find((l) => l.fams && l.fams.includes(fam) && (!l.st.length || !st || l.st.includes(st))) || w.lots.find((l) => l.fams && l.fams.includes(fam)) || w.lots[0];
  };

  // objets par gare
  const emTotal = L.id === '15S' ? 299 : 0;
  let emLeft = emTotal;
  sts.forEach((st, si) => {
    const mix = st.stage === 'open' ? [0, .02, .08, .22, .68] : L.id === '18' ? [.88, .12, 0, 0, 0] : L.stage === 'late' && si === L.focus.remise ? [.2, .44, .24, .1, .02] : L.stage === 'late' && si === L.focus.done ? [0, .06, .24, .4, .3] : L.mix;
    st.target = st.stage === 'open' ? .88 : L.id === '18' ? .1 : L.target;
    const kit = [['BOX', 1, 1], ['OA', 1, 2], ['VOIE', 1, 1], ['CBTC', 1, 1], ['ENE', 1, 1], ['EM', 8, 16], ['ASC', 2, 4], ['FQ', 2, 2], ['VENT', 2, 2], ['VAL', 1, 2], ['SIV', 1, 1], ['VIDEO', 1, 1], ['SSI', 1, 1], ['COM', 0, 2], ['PARVIS', 1, 1], ['TROT', 1, 2], ['GR', 0, 1], ['VELO', 1, 1], ['ECL', 1, 1], ['RES', 1, 1]];
    kit.forEach(([fam, a, b]) => {
      let n = rint(r, a, b);
      if (fam === 'EM' && emTotal) { n = si === sts.length - 1 ? emLeft : Math.max(10, Math.min(emLeft - (sts.length - 1 - si) * 10, Math.round(emTotal / sts.length) + rint(r, -6, 6))); emLeft -= n; }
      if (fam === 'GR' && [L.focus.notices, L.focus.pmr].includes(si)) n = 1;
      if (fam === 'COM' && si === L.focus.com) n = Math.max(1, n);
      for (let i = 0; i < n; i++) addObj(w, r, L, { fam, st, i, n, mix, lot: lotFor(fam, st.id) });
    });
  });
  // linéaire : tunnels, rames, centre d'exploitation
  for (let i = 0; i < sts.length - 1; i++) addObj(w, r, L, { fam: 'TUN', st: null, i, n: 1, mix: sts[i + 1].stage === 'open' && sts[i].stage === 'open' ? [0, 0, .1, .2, .7] : L.id === '18' ? [.9, .1, 0, 0, 0] : L.mix, lot: lotFor('TUN', null, i), where: `Interstation ${sts[i].name} → ${sts[i + 1].name}`, name: `Tunnel ${sts[i].name} → ${sts[i + 1].name}` });
  if (L.id === '15S') addObj(w, r, L, { fam: 'OA', st: null, i: 0, n: 1, mix: L.mix, lot: w.lots.find((l) => l.code === 'T2E'), where: 'Arrière-gare de Noisy–Champs', name: 'Arrière-gare de Noisy–Champs (ouvrage de retournement)' });
  for (let i = 0; i < L.mrN; i++) addObj(w, r, L, { fam: 'MR', st: null, i, n: L.mrN, mix: L.id === '18' ? [0, .1, .2, .2, .5] : [.35, .4, .2, .05, 0], lot: lotFor('MR'), where: L.depot ? L.depot.label : 'Flotte', name: `Rame ${L.mr === 'MR18' ? 'L18' : L.mr} n°${pad(i + 1)}` });
  if (L.depot) ['Pont roulant de l’atelier', 'Tour en fosse', 'Machine à laver les trains', 'Voies de remisage et aiguillages', 'Poste de commande centralisé (PCC)'].forEach((nm, i) => addObj(w, r, L, { fam: 'SMR', st: null, i, n: 5, mix: L.stage === 'early' ? [1, 0, 0, 0, 0] : L.id === '18' ? [0, 0, .2, .2, .6] : [.1, .3, .3, .25, .05], lot: lotFor('SMR'), where: L.depot.label, name: nm }));

  buildGovernance(w, r);
  w.objects.forEach((o) => w.objMap.set(o.id, o));
  return w;
}
const stOf = (sts, id) => sts.find((s) => s.id === id);

function objName(fam, i, st, r, L, sts) {
  const levels3 = ['surface → salle', 'salle → mezzanine', 'mezzanine → quai'];
  const next = sts[st.idx + 1], prev = sts[st.idx - 1];
  switch (fam) {
    case 'BOX': return 'Gros œuvre de la gare (boîte, parois, dalles)';
    case 'OA': return `Ouvrage annexe OA-${pad(st.idx * 2 + i + 1)} (puits de ventilation et d’accès secours)`;
    case 'VOIE': return 'Voie et caténaire rigide, section de la gare';
    case 'CBTC': return 'Équipements d’automatisme en gare (CBTC)';
    case 'ENE': return 'Poste éclairage-force et poste de redressement';
    case 'EM': return `Escalier mécanique EM-${pad(i + 1)} (${levels3[i % 3]})`;
    case 'ASC': return `Ascenseur ASC-${pad(i + 1)} (${['surface → salle', 'salle → quai', 'mezzanine → quai', 'surface → quai'][i % 4]})`;
    case 'FQ': return `Façade de quai, voie ${i + 1} (vers ${(i ? next : prev) ? (i ? next : prev).name : 'l’arrière-gare'})`;
    case 'VENT': return `Ventilateur de désenfumage VD-${i + 1}`;
    case 'VAL': return `Ligne de contrôle, accès ${['principal', 'secondaire'][i]}`;
    case 'SIV': return 'Information voyageurs (écrans, sonorisation)';
    case 'VIDEO': return `Vidéoprotection (${rint(r, 34, 76)} caméras)`;
    case 'SSI': return 'Sécurité incendie et éclairage de sécurité';
    case 'COM': return `Local commercial C${i + 1} (${rint(r, 40, 180)} m²)`;
    case 'PARVIS': return `Parvis (${new Intl.NumberFormat('fr-FR').format(rint(r, 12, 42) * 100)} m²)`;
    case 'TROT': return `Trottoirs et voirie, accès ${['principal', 'secondaire'][i]}`;
    case 'GR': return `Gare routière (${rint(r, 4, 10)} quais bus)`;
    case 'VELO': return `Abri vélos sécurisé (${rint(r, 6, 24) * 10} places)`;
    case 'ECL': return 'Éclairage public des abords';
    case 'RES': return 'Raccordements aux réseaux (eau, électricité, télécom)';
    default: return famById(fam).label;
  }
}

function addObj(w, r, L, { fam, st, i, n, mix, lot, where, name }) {
  const f = famById(fam);
  const state = pickW(r, mix);
  const code = f.code.normalize('NFD').replace(/[^A-Z]/g, '');
  const id = st ? `${L.code}-${st.id}-${code}-${pad(i + 1)}` : `${L.code}-${fam === 'SMR' ? 'CEX' : fam === 'OA' ? 'AG' : code}-${pad(i + 1)}`;
  const docT = DOCS[f.docs];
  const pOk = [.12, .5, .94, .99, 1][state];
  const rec = state >= 1 ? new Date(TODAY.getTime() - rint(r, L.id === '18' ? 20 : 60, L.stage === 'early' ? 200 : 520) * DAY) : null;
  const docs = docT.map((t) => { const x = r(); const s = x < pOk ? 'ok' : x < pOk + .12 ? 'rev' : 'miss'; return { t, s, at: s === 'ok' ? new Date(TODAY.getTime() - rint(r, 3, 300) * DAY) : null }; });
  if (state >= 2) docs.forEach((d) => { if (d.s === 'miss' && r() < .8) { d.s = 'ok'; d.at = dd(-rint(r, 5, 120)); } });
  let gest = f.gest;
  if (fam === 'TROT' && i === 1) gest = 'DEP';
  const recvP = gest === 'VILLE' ? (st && /Vitry/.test(st.town) ? 'ogarnier' : st && /Créteil/.test(st.town) ? 'mrobin' : 'refcom') : gestById(gest).who;
  const o = {
    id, fam, st: st ? st.id : null, where: where || (st ? st.name : ''), name: name || objName(fam, i, st, r, L, w.stations), lot: lot.id, state, docs, gest,
    value: Math.round(rbet(r, f.val[0], f.val[1]) / 1000) * 1000, rec,
    gpa: rec ? new Date(rec.getTime() + 365 * DAY) : null, dec: rec ? new Date(rec.getTime() + 3652 * DAY) : null,
    p: { sgp: lot.sgp, ent: lot.entLead, idfm: f.domain === 'MR' ? 'nhaddad' : f.domain === 'ESP' ? 'hlambert' : fam === 'VAL' || fam === 'SIV' ? 'smartin' : fam === 'SSI' || fam === 'VENT' ? 'jmorel' : 'agathe', recv: recvP },
    res: [], hist: [],
  };
  // réserves
  const pr = [0, .5, .42, .3, .12][state];
  if (r() < pr) {
    const k = rint(r, 1, state === 1 ? 3 : 2);
    for (let j = 0; j < k; j++) {
      const sev = ['bloquante', 'majeure', 'mineure'][pickW(r, state >= 3 ? [.03, .3, .67] : [.11, .37, .52])];
      const tpl = RES_TPL[fam] || ['Point à reprendre'];
      const res = { id: `R-${String(1000 + w.reserves.length + Math.floor(r() * 9)).padStart(4, '0')}`, obj: id, sev, label: tpl[rint(r, 0, tpl.length - 1)], cost: Math.round((sev === 'bloquante' ? rbet(r, 25e3, 180e3) : sev === 'majeure' ? rbet(r, 6e3, 40e3) : rbet(r, 800, 6e3)) / 100) * 100, due: dd(rint(r, -40, 80)), status: r() < [0, .15, .4, .6, .7][state] ? 'levée' : r() < .3 ? 'en levée' : 'ouverte', raised: rec || dd(-30) };
      res.id = `R-${1000 + w.reserves.length}`;
      o.res.push(res); w.reserves.push(res);
    }
  }
  // historique
  o.hist.push({ t: `Ordre de service du lot ${lot.code}`, at: lot.start, p: lot.sgp });
  if (rec) o.hist.push({ t: `Réception prononcée${o.res.length ? ` avec ${o.res.length} réserve${o.res.length > 1 ? 's' : ''}` : ' sans réserve'}`, at: rec, p: lot.sgp, c: 'var(--warn)' });
  if (state >= 2) o.hist.push({ t: 'Dossier des ouvrages exécutés complet', at: new Date(Math.min(TODAY.getTime() - 3 * DAY, rec.getTime() + rint(r, 30, 160) * DAY)), p: 'lgirard', c: 'var(--info)' });
  if (state >= 3) o.hist.push({ t: `Visa IDFM et ${gestById(gest).short}`, at: dd(-rint(r, 2, 40)), p: 'agathe', c: 'var(--g-gi)' });
  if (state >= 4) o.hist.push({ t: 'PV de remise signé, reprise en gestion', at: dd(-rint(r, 1, 30)), p: gestById(gest).who, c: 'var(--ok)' });
  o.hist.sort((a, b) => a.at - b.at).reverse();
  w.objects.push(o);
  return o;
}

function mkEvm(r, lot) {
  const nM = Math.max(6, monthsBetween(lot.start, lot.endF));
  const plannedM = Math.max(4, monthsBetween(lot.start, lot.end));
  const now = Math.min(nM, Math.max(1, monthsBetween(lot.start, TODAY)));
  const sm = (x) => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };
  const months = [], pv = [], ev = [], ac = [];
  const evNow = lot.budget * lot.prog / 100, ratio = lot.eac / lot.budget;
  for (let i = 0; i <= nM; i++) {
    const dt = new Date(lot.start.getFullYear(), lot.start.getMonth() + i, 1);
    months.push(`${MONTHS[dt.getMonth()]} ${String(dt.getFullYear()).slice(2)}`);
    pv.push(lot.budget * sm(i / plannedM));
    ev.push(evNow * sm(i / now));
    ac.push(evNow * sm(i / now) * (1 + (ratio - 1) * Math.min(1, (i / now) * 1.2)));
  }
  return { months, pv, ev, ac, now };
}

/* ---------- Mesures ---------- */
const objReserves = (w, id) => (w.objMap.get(id)?.res || []).filter((x) => x.status !== 'levée');
const objById = (w, id) => w.objMap.get(id);
const stById = (w, id) => w.stations.find((s) => s.id === id);
const stName = (w, id) => (id ? stById(w, id)?.name || '' : 'Linéaire');
const objWhere = (o) => o.where;
function objScore(w, o) {
  const d = o.docs.filter((x) => x.s === 'ok').length / o.docs.length;
  const b = objReserves(w, o.id).some((r) => r.sev === 'bloquante') ? .08 : 0;
  return Math.max(0, .72 * (o.state / 4) + .28 * d - b);
}
const avg = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0);
function stReady(w, id) { return avg(w.objects.filter((o) => o.st === id).map((o) => objScore(w, o))); }
function docsRatio(objs) { let a = 0, b = 0; objs.forEach((o) => { b += o.docs.length; a += o.docs.filter((x) => x.s === 'ok').length; }); return b ? a / b : 0; }
function stDocs(w, id) { return docsRatio(w.objects.filter((o) => o.st === id)); }
function stReserves(w, id) { return w.objects.filter((o) => o.st === id).flatMap((o) => objReserves(w, o.id)); }
function isGrey(w, o) { return w.greyZones.some((g) => !g.done && g.st === o.st && g.fam === o.fam); }
function objExposure(w, o) {
  const res = objReserves(w, o.id).reduce((a, r) => a + r.cost * (o.gpa && o.gpa < TODAY ? 1.4 : 1), 0);
  const miss = o.docs.filter((x) => x.s !== 'ok').length * DOC_COST;
  const grey = isGrey(w, o) ? o.value * .012 : 0;
  return Math.round(res + miss + grey);
}
function stExposure(w, id) { return w.objects.filter((o) => o.st === id).reduce((a, o) => a + objExposure(w, o), 0); }
function stVisas(w, id) { const v = w.visas.filter((x) => x.st === id && !visaDone(x)); return { pending: v.length, late: v.filter(visaLate).length }; }
function visaDone(v) { return v.steps.every((s) => s.s === 'vise' || s.s === 'rem' || s.s === 'ref'); }
function visaLate(v) { return !visaDone(v) && v.due < TODAY; }
function lotStats(w, l) {
  const objs = w.objects.filter((o) => o.lot === l.id);
  const res = objs.flatMap((o) => objReserves(w, o.id));
  return { objs, docs: docsRatio(objs), docsMissing: objs.reduce((a, o) => a + o.docs.filter((x) => x.s !== 'ok').length, 0), res: res.length, bloq: res.filter((r) => r.sev === 'bloquante').length, expo: objs.reduce((a, o) => a + objExposure(w, o), 0) };
}
function tierColor(v, target) { return v >= target - .03 ? 'var(--ok)' : v >= target - .15 ? 'var(--warn)' : 'var(--crit)'; }
const sevRank = (s) => ({ bloquante: 0, majeure: 1, mineure: 2 }[s]);
const sevCls = (s) => ({ bloquante: 'crit', majeure: 'warn', mineure: 'info' }[s]);

function scopeObjs(w, P) { return P.gest ? w.objects.filter((o) => o.gest === P.gest || (P.gest === 'VILLE' && o.gest === 'DEP')) : w.objects; }
function kpis(w, objs, P) {
  const res = objs.flatMap((o) => objReserves(w, o.id));
  const mine = P && P.gest ? w.visas.filter((v) => !visaDone(v) && v.steps.some((s) => s.p === P.person && (s.s === 'att' || s.s === 'lu'))) : w.visas.filter((v) => !visaDone(v));
  return {
    ready: Math.round(avg(objs.map((o) => objScore(w, o))) * 100), dReady: w.line.trend,
    transferred: objs.filter((o) => o.state === 4).length, vises: objs.filter((o) => o.state === 3).length, total: objs.length,
    res: res.length, bloq: res.filter((r) => r.sev === 'bloquante').length, resLate: res.filter((r) => r.due < TODAY).length,
    docs: Math.round(docsRatio(objs) * 100), docsMissing: objs.reduce((a, o) => a + o.docs.filter((x) => x.s !== 'ok').length, 0),
    visas: mine.length, visasLate: mine.filter(visaLate).length,
    expo: objs.reduce((a, o) => a + objExposure(w, o), 0),
  };
}
function domainReady(w, objs) {
  return DOMAINS.map((d) => {
    let v;
    if (d.id === 'JUR') { const c = w.conventions; v = (c.filter((x) => x.status === 'signée').length + .45 * c.filter((x) => x.status === 'en négociation').length) / c.length; }
    else if (d.id === 'SEC') v = w.line.secReady;
    else { const o = objs.filter((x) => famById(x.fam).domain === d.id); if (!o.length) return null; v = avg(o.map((x) => objScore(w, x))); }
    return { id: d.id, label: d.label, v: Math.round(v * 100) };
  }).filter(Boolean);
}
function peopleLoad(w) {
  const m = {};
  w.visas.filter((v) => !visaDone(v)).forEach((v) => v.steps.forEach((s) => {
    if (s.s !== 'att' && s.s !== 'lu') return;
    m[s.p] = m[s.p] || { pending: 0, late: 0, docs: [] };
    m[s.p].pending++; m[s.p].docs.push(v);
    if (v.due < TODAY) m[s.p].late++;
  }));
  return m;
}

function pageHead({ title, lede = '', actions = '', eyebrow = true }) {
  const L = W().line;
  return `<div class="page-head"><div class="titles">${eyebrow ? `<div class="eyebrow">${roundel(L)}<span><b>${esc(L.name)}</b> · ${esc(L.from)} ↔ ${esc(L.to)} · ${esc(L.phase)}</span></div>` : ''}<h1>${title}</h1>${lede ? `<p class="lede">${lede}</p>` : ''}</div><div class="actions">${actions}</div></div>`;
}

function eurParts(n) {
  const s = eur(n); const m = s.match(/^(.*?)\s?(M€|k€|€)$/);
  return m ? `${m[1]}<small>${m[2]}</small>` : s;
}

function kpiStrip(k) {
  const items = [
    { l: 'Préparation à la remise', v: `${k.ready}<small>%</small>`, s: `<span class="delta ${k.dReady >= 0 ? 'ok' : 'crit'}">${k.dReady >= 0 ? '+' : ''}${k.dReady} pts</span> en 7 jours` },
    { l: 'Objets remis en gestion', v: `${nf.format(k.transferred)}<small>/ ${nf.format(k.total)}</small>`, s: `${nf.format(k.vises)} visés, prêts à transférer` },
    { l: 'Réserves ouvertes', v: nf.format(k.res), s: `<span class="crit">${k.bloq} bloquantes</span> · ${k.resLate} hors délai` },
    { l: 'Documentation reçue', v: `${k.docs}<small>%</small>`, s: `${nf.format(k.docsMissing)} documents manquants` },
    { l: 'Visas en attente', v: nf.format(k.visas), s: k.visasLate ? `<span class="crit">${k.visasLate} en retard</span>` : 'aucun retard' },
    { l: 'Exposition financière', v: eurParts(k.expo), s: 'si transfert en l’état' },
  ];
  return `<div class="kpis">${items.map((i) => `<div class="kpi"><div class="lbl">${i.l}</div><div class="val">${i.v}</div><div class="sub">${i.s}</div></div>`).join('')}</div>`;
}

function briefCard(w, P, k) {
  const mailsTodo = w.mails.filter((m) => !m.done);
  const mtg = w.meeting;
  const focus = w.stations[w.line.focus.remise];
  const worst = [...w.stations].sort((a, b) => stExposure(w, b.id) - stExposure(w, a.id))[0];
  const share = Math.round((stExposure(w, worst.id) / Math.max(1, k.expo)) * 100);
  const docsLot = [...w.lots].sort((a, b) => lotStats(w, b).docsMissing - lotStats(w, a).docsMissing)[0];
  const isAg = P.id === 'agathe' || P.id === 'dir';
  const txt = isAg
    ? `Depuis hier soir, Témoin a lu <b>${w.mailsTotal} courriels</b> et ${mtg.done ? 'intégré' : 'transcrit'} le <b>${esc(mtg.short)}</b>. <b>${mailsTodo.length} demandent une action</b>. <b>${k.visasLate} visas</b> sont en retard, dont le dossier de remise de <b>${esc(focus.name)}</b>. Le lot <b>${esc(docsLot.code)}</b> concentre le plus de documents manquants (${nf.format(lotStats(w, docsLot).docsMissing)}). Si la ligne était transférée aujourd’hui, l’exposition serait de <b>${eur(k.expo)}</b>, dont ${share} % sur <b>${esc(worst.name)}</b>.`
    : `Dans votre périmètre (${esc(P.scopeLabel)}), <b>${plural(k.visas, 'visa', 'visas')}</b> vous ${k.visas > 1 ? 'attendent' : 'attend'} dont <b>${k.visasLate} en retard</b>, <b>${plural(k.bloq, 'réserve bloquante', 'réserves bloquantes')}</b> ${k.bloq > 1 ? 'restent ouvertes' : 'reste ouverte'} et <b>${nf.format(k.docsMissing)} documents</b> manquent. Exposition sur vos objets si transfert en l’état : <b>${eur(k.expo)}</b>.`;
  return `<div class="brief">
    <div class="ai-tag">${ic('spark')} Briefing du matin · ${esc(timeHM(TODAY))}</div>
    <h2>${isAg ? `${plural(mailsTodo.length, 'sujet', 'sujets')} à traiter avant le comité, ${plural(k.bloq, 'réserve bloquante', 'réserves bloquantes')} sur la ligne` : `${plural(k.visas, 'visa', 'visas')} et ${plural(k.bloq, 'réserve bloquante', 'réserves bloquantes')} dans votre périmètre`}</h2>
    <p>${txt}</p>
    <div class="brief-stats">
      <div><b>${w.mailsTotal}</b>courriels lus</div>
      <div><b>${nf.format(w.docsToday)}</b>documents rattachés</div>
      <div><b>${w.timeSaved}</b>temps de tri évité</div>
    </div>
    <div class="actions" style="margin-top:18px">
      <button class="btn" data-a="go" data-v="flux">${ic('mail')} Voir les courriels</button>
      <button class="btn" data-a="ask" data-q="Qu’est-ce qui bloque la remise de ${esc(focus.name)} ?">${ic('spark')} Qu’est-ce qui bloque ${esc(focus.name)} ?</button>
    </div>
  </div>`;
}

function countdownCard(w) {
  const next = w.milestones.filter((m) => !m.done);
  const m = next[0];
  const n = m ? days(m.date) : 0;
  return `<div class="card countdown">
    <h3>Prochain jalon</h3>
    <div class="cd-big"><b>J−${Math.max(0, n)}</b><span class="muted">${m ? esc(m.label) : 'Tous les jalons sont passés'}</span></div>
    <div class="small muted">${m ? `${esc(dateLong(m.date))} · ${esc(m.note || '')}` : ''}</div>
    <div class="divider"></div>
    ${next.slice(1, 4).map((x) => `<div class="kv"><span>${esc(x.label)}</span><b class="small">${esc(fmtD(x.date, { y: true }))}</b></div>`).join('')}
  </div>`;
}

function milestonesTrack(w) {
  const ms = w.milestones, n = ms.length;
  const k = ms.findIndex((m) => !m.done);
  const prevD = k > 0 ? ms[k - 1].date : null;
  const frac = k < 0 ? n - 1 : k === 0 ? 0 : (k - 1) + Math.max(0, Math.min(1, (TODAY - prevD) / (ms[k].date - prevD)));
  const today = (frac / (n - 1)) * 100;
  return `<div class="mstep" style="--n:${n}">
    <div class="mstep-rail"><i style="width:${today}%"></i><span class="mstep-today" style="left:${today}%">Aujourd’hui</span></div>
    <ol class="mstep-list">${ms.map((m, i) => `<li class="${m.done ? 'done' : i === k ? 'now' : ''}"><span class="dot">${m.done ? ic('check') : ''}</span><b>${esc(fmtD(m.date, { y: true }))}</b><span class="l">${esc(m.label)}</span>${m.note ? `<span class="nt">${esc(m.note)}</span>` : ''}</li>`).join('')}</ol>
  </div>`;
}

function expoBars(w, objs) {
  const ids = new Set(objs.map((o) => o.id));
  const rows = w.stations.map((s) => ({ s, e: w.objects.filter((o) => o.st === s.id && ids.has(o.id)).reduce((a, o) => a + objExposure(w, o), 0) })).sort((a, b) => b.e - a.e).slice(0, 7);
  const max = Math.max(1, rows[0]?.e || 1);
  return `<div class="ebars">${rows.map(({ s, e }) => `<button class="ebar" data-a="enterStation" data-id="${s.id}"><span class="n">${esc(s.name)}</span><span class="b"><i style="width:${(e / max) * 100}%"></i></span><span class="v">${eur(e)}</span></button>`).join('')}</div>
  <p class="small muted" style="margin-top:10px">Réserves non levées, documents à reconstituer et zones sans gestionnaire désigné. Cliquez sur une gare pour y entrer.</p>`;
}

function feedItem(e) {
  return `<div class="feed-item ${e.fresh ? 'fresh' : ''}">${e.p ? av(e.p, 'sm') : `<span class="av sm" style="--c:var(--line)">${ic('spark')}</span>`}<div>${e.t}</div><span class="when">${esc(e.when || rel(e.at))}</span></div>`;
}

function vTwin() {

  return `
  ${pageHead({
    title: st ? esc(st.name) : 'Jumeau de la ligne',
    lede: st ? `Coupe schématique de la gare. Chaque zone et chaque équipement est un objet du registre : cliquez pour voir son état, ses documents et qui le gérera après la remise.` : `La ligne comme un plan vivant : chaque gare porte son état de préparation, ses réserves, ses documents et ses visas. Cliquez sur une gare, puis entrez dedans.`,
    actions: st
      ? `<div class="seg" role="group" aria-label="Colorer par">${colorBys.map(([id, l]) => `<button data-a="colorBy" data-id="${id}" aria-pressed="${S.colorBy === id}">${l}</button>`).join('')}</div>`
      : `<div class="seg" role="group" aria-label="Calque">${layers.map(([id, l]) => `<button data-a="layer" data-id="${id}" aria-pressed="${S.layer === id}">${l}</button>`).join('')}</div>`,
  })}
  <div class="twin">
    <div class="twin-stage">

      <div class="twin-float">
        <div class="crumbs">${st ? `<button data-a="exitStation">${esc(w.line.name)}</button><span class="muted">›</span><b>${esc(st.name)}</b>${S.zoneSel ? `<span class="muted">›</span><span>${esc(zoneById(S.zoneSel).label)}</span>` : ''}` : `<b>${esc(w.line.name)}</b><span class="muted">· ${w.stations.length} gares · ${w.line.km} km · ${w.objects.length} objets suivis</span>`}</div>
      </div>
